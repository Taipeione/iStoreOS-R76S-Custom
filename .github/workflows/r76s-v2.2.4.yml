          fdisk -l "$TF_RAW" | grep -qi '0x76222550' || { echo 'ERROR: TF disk signature patch failed'; exit 1; }

          pigz -9 -c "$OTA_RAW" > "$OTA_IMAGE"
          pigz -9 -c "$TF_RAW" > "$TF_IMAGE"
          gzip -t "$OTA_IMAGE"
          gzip -t "$TF_IMAGE"

          test -x "$FWTOOL"
          test -s "$SYSUPGRADE_META"
          "$FWTOOL" -I "$SYSUPGRADE_META" "$OTA_IMAGE"
          "$FWTOOL" -I "$SYSUPGRADE_META" "$TF_IMAGE"

          for img in "$OTA_IMAGE" "$TF_IMAGE"; do
            check="/tmp/$(basename "$img").meta"
            rm -f "$check"
            "$FWTOOL" -i "$check" "$img"
            test -s "$check"
            grep -qF 'friendlyarm,nanopi-r76s' "$check"
            grep -qF 'V2.2.5' "$check"
          done

          cd "$RELEASE_DIR"
          OTA_SHA="$(sha256sum "$OTA_NAME" | awk '{print $1}')"
          TF_SHA="$(sha256sum "$TF_NAME" | awk '{print $1}')"
          {
            printf '%s  %s\n' "$OTA_SHA" "$OTA_NAME"
            printf '%s  %s\n' "$TF_SHA" "$TF_NAME"
          } | tee sha256sums

          cat > version.latest <<EOF
          [24.10.8-V2.2.5]($OTA_NAME)
          R76S Custom V2.2.5 / RK3576 / OTA image
          SHA256: $OTA_SHA
          EOF

          cat > version.index <<'EOF'
          24.10.8-V2.2.5
          EOF

          cat > ota.footer.html <<'EOF'
          <p>Online upgrade uses the OTA image. For TF/eMMC dual-boot testing, write the separate TF image with disk signature 0x76222550.</p>
          EOF

          cat > BOOTLOADER_INFO.txt <<EOF
          R76S Custom v2.2.5
          Target: rockchip/armv8 / FriendlyElec NanoPi R76S / RK3576
          Bootloader source: iStoreOS 24.10.8-2026073111 R76S
          Bootloader MD5: $BOOT_MD5
          OTA image: $OTA_NAME
          TF test image: $TF_NAME
          TF disk signature: 0x76222550 (PARTUUID 76222550-01/02/03)
          Features: PassWall + PassWall2, UU removed, SmartDNS updater fixed, CPU temperature page, GitHub Direct.
          EOF

      - name: Copy build metadata
        run: |
          RELEASE_DIR="$TARGET_DIR/release-v2.2.5"
          for file in config.buildinfo feeds.buildinfo version.buildinfo profiles.json; do
            [ -f "$TARGET_DIR/$file" ] && cp "$TARGET_DIR/$file" "$RELEASE_DIR/"
          done
          find "$TARGET_DIR" -maxdepth 1 -type f -name '*friendlyarm_nanopi-r76s*.manifest' -exec cp {} "$RELEASE_DIR/" \; || true

      - name: Final verification
        run: |
          RELEASE_DIR="$TARGET_DIR/release-v2.2.5"
          OTA_IMAGE="$RELEASE_DIR/R76S-Custom-v2.2.5-OTA-squashfs.img.gz"
          TF_IMAGE="$RELEASE_DIR/R76S-Custom-v2.2.5-TF-squashfs.img.gz"
          test -s "$OTA_IMAGE"
          test -s "$TF_IMAGE"
          for ota_file in version.latest version.index sha256sums ota.footer.html BOOTLOADER_INFO.txt; do
            test -s "$RELEASE_DIR/$ota_file"
          done
          grep -qF '24.10.8-V2.2.5' "$RELEASE_DIR/version.latest"
          grep -qxF '24.10.8-V2.2.5' "$RELEASE_DIR/version.index"

          for img in "$OTA_IMAGE" "$TF_IMAGE"; do
            stripped="/tmp/$(basename "$img").stripped.gz"
            meta="/tmp/$(basename "$img").verify.meta"
            cp -f "$img" "$stripped"
            "$FWTOOL" -i "$meta" -t "$stripped"
            grep -qF 'friendlyarm,nanopi-r76s' "$meta"
            grep -qF 'V2.2.5' "$meta"
            gzip -t "$stripped"
            boot_md5="$(gzip -dc "$stripped" | dd bs=512 skip=64 count=32704 status=none | md5sum | awk '{print $1}')"
            [ "$boot_md5" = "$BOOT_MD5" ] || { echo "ERROR: bootloader mismatch in $img"; exit 1; }
          done

          echo "R76S v2.2.5 final verification passed."

      - name: Upload final v2.2.5 firmware
        uses: actions/upload-artifact@v4
        with:
          name: R76S-Custom-v2.2.5-OTA-TF
          path: openwrt/bin/targets/rockchip/armv8/release-v2.2.5/*
          if-no-files-found: error

      - name: Publish OTA assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r76s-v2.2.5-${{ github.run_number }}
          name: R76S Custom v2.2.5 build ${{ github.run_number }}
          make_latest: true
          generate_release_notes: false
          body: |
            R76S Custom v2.2.5
            PassWall + PassWall2 / SmartDNS / AdGuard Home / iStoreOS QuickStart
            UU removed. CPU temperature page enabled.
            OTA uses the OTA image; TF dual-boot testing uses the TF image with an independent PARTUUID base.
          files: |
            openwrt/bin/targets/rockchip/armv8/release-v2.2.5/R76S-Custom-v2.2.5-OTA-squashfs.img.gz
            openwrt/bin/targets/rockchip/armv8/release-v2.2.5/R76S-Custom-v2.2.5-TF-squashfs.img.gz
            openwrt/bin/targets/rockchip/armv8/release-v2.2.5/version.latest
            openwrt/bin/targets/rockchip/armv8/release-v2.2.5/version.index
            openwrt/bin/targets/rockchip/armv8/release-v2.2.5/sha256sums
            openwrt/bin/targets/rockchip/armv8/release-v2.2.5/ota.footer.html
            openwrt/bin/targets/rockchip/armv8/release-v2.2.5/BOOTLOADER_INFO.txt

      - name: Build finished
        run: |
          echo "===================================="
          echo " R76S Custom v2.2.5 BUILD COMPLETE "
          echo " PassWall + PassWall2 / UU removed "
          echo " OTA + independent-PARTUUID TF image "
          echo "===================================="
