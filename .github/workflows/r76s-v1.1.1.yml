                    <td class="td" id="r76s-boot">读取中...</td>
                  </tr>

                  <tr class="tr">
                    <td class="td">升级方式</td>
                    <td class="td r76s-mode">
                      保留用户配置 + 增量补齐新版本内容
                    </td>
                  </tr>

                  <tr class="tr">
                    <td class="td">状态</td>
                    <td class="td" id="r76s-status">读取中...</td>
                  </tr>

                </table>

                <div class="r76s-actions">
                  <button
                    class="cbi-button cbi-button-action"
                    id="r76s-check"
                    type="button">
                    检查更新
                  </button>

                  <button
                    class="cbi-button cbi-button-apply"
                    id="r76s-download"
                    type="button"
                    disabled>
                    请先检查更新
                  </button>
                </div>

                <table class="table r76s-table">

                  <tr class="tr">
                    <td class="td">下载进度</td>
                    <td class="td">
                      <div class="r76s-progress">
                        <div
                          class="r76s-progress-bar"
                          id="r76s-progress-bar">
                        </div>
