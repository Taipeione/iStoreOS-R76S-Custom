                      <div
                        class="r76s-progress-text"
                        id="r76s-progress-text">
                        0%
                      </div>
                    </td>
                  </tr>

                  <tr class="tr">
                    <td class="td">SHA256</td>
                    <td class="td" id="r76s-sha">
                      — 未校验
                    </td>
                  </tr>

                  <tr class="tr">
                    <td class="td">Metadata</td>
                    <td class="td" id="r76s-metadata">
                      — 未校验
                    </td>
                  </tr>

                  <tr class="tr">
                    <td class="td">Sysupgrade</td>
