# R76S V2.2.6 Consolidated Build
name: R76S Build v2.2.6
run-name: "R76S v2.2.6 #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify V2.2.6 workflow identity
        run: |
          echo "=========================================="
          echo " WORKFLOW_REV=R76S-V2.2.6-CONSOLIDATED"
          echo " EXPECTED_STEPS=30"
          echo " COMMIT=$GITHUB_SHA"
          echo "=========================================="
          test -f .github/workflows/r76s-v2.2.6.yml
          grep -qF 'R76S V2.2.6 Consolidated Build' .github/workflows/r76s-v2.2.6.yml
          grep -qF 'name: Build firmware' .github/workflows/r76s-v2.2.6.yml
          grep -qF 'name: Publish OTA assets to GitHub Release' .github/workflows/r76s-v2.2.6.yml
          sha256sum .github/workflows/r76s-v2.2.6.yml

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-dev \
            python3-pyelftools \
            python3-setuptools \
            rsync \
            swig \
            time \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            xsltproc \
            zstd \
            pigz \
            ca-certificates \
            ccache

          echo "===== Verify Python elftools ====="

          python3 -c "from elftools.elf.elffile import ELFFile; print('pyelftools OK')"

      - name: Download and verify R76S bootloader
        run: |
          OFFICIAL_URL="https://fw.koolcenter.com/iStoreOS/r76s/istoreos-24.10.8-2026073111-r76s-squashfs.img.gz"

          OFFICIAL_GZ="/tmp/official-r76s-24.10.8.img.gz"
          BOOT_BIN="/tmp/r76s-official-bootloader.bin"

          echo "===== Download official R76S reference image ====="

          curl -fL \
            --retry 3 \
            --retry-delay 5 \
            "$OFFICIAL_URL" \
            -o "$OFFICIAL_GZ"

          test -s "$OFFICIAL_GZ"

          echo
          echo "===== Extract 32KB - 16MB bootloader region ====="

          gzip -dc "$OFFICIAL_GZ" 2>/dev/null | \
            dd \
              of="$BOOT_BIN" \
              bs=512 \
              skip=64 \
              count=32704 \
              status=none

          test -s "$BOOT_BIN"

          BOOT_SIZE=$(stat -c%s "$BOOT_BIN")

          echo "Bootloader size: $BOOT_SIZE bytes"

          EXPECTED_SIZE=16744448

          if [ "$BOOT_SIZE" -ne "$EXPECTED_SIZE" ]; then
            echo "ERROR: Bootloader region size mismatch."
            echo "Expected: $EXPECTED_SIZE"
            echo "Actual:   $BOOT_SIZE"
            exit 1
          fi

          BOOT_MD5=$(
            md5sum "$BOOT_BIN" \
              | awk '{print $1}'
          )

          EXPECTED_MD5="80f6bcbcbb912ecce884f24e275f2ac6"

          echo "Bootloader MD5: $BOOT_MD5"

          if [ "$BOOT_MD5" != "$EXPECTED_MD5" ]; then
            echo "ERROR: Official bootloader hash mismatch."
            echo "Expected: $EXPECTED_MD5"
            echo "Actual:   $BOOT_MD5"
            exit 1
          fi

          echo
          echo "Official R76S bootloader verified successfully."

          echo "BOOT_BIN=$BOOT_BIN" >> "$GITHUB_ENV"
          echo "BOOT_MD5=$BOOT_MD5" >> "$GITHUB_ENV"

      - name: Clone iStoreOS source
        run: |
          git clone \
            --depth=1 \
            --branch istoreos-24.10 \
            https://github.com/istoreos/istoreos.git \
            openwrt

      - name: Restore download and compiler caches
        uses: actions/cache@v4
        with:
          path: |
            openwrt/dl
            ~/.ccache
          key: r76s-v226-${{ runner.os }}-${{ hashFiles('config/R76S.config') }}
          restore-keys: |
            r76s-v226-${{ runner.os }}-
            r76s-${{ runner.os }}-

      - name: Set R76S v2.2.6 firmware identity
        run: |
          cd openwrt

          RELEASE_FILE="package/base-files/files/etc/openwrt_release"
          test -f "$RELEASE_FILE"

          # iStoreOS OTA compares DISTRIB_RELEASE-DISTRIB_REVISION.
          # Keep the 24.10.8 release number and give the custom firmware a
          # stable revision identity that our GitHub Release metadata can match.
          sed -i \
            "s/^DISTRIB_REVISION=.*/DISTRIB_REVISION='V2.2.6'/" \
            "$RELEASE_FILE"

          grep -q "^DISTRIB_REVISION='V2.2.6'$" "$RELEASE_FILE"

          echo "===== Custom release identity ====="
          grep -E '^DISTRIB_(RELEASE|REVISION)=' "$RELEASE_FILE" || true

      - name: Verify R76S prerequisites
        run: |
          cd openwrt

          echo "===== Check RK3576 / R76S prerequisites ====="

          test -f \
            target/linux/rockchip/dts/rk3576/rk3576-nanopi-r76s.dts

          grep -q \
            'compatible = "friendlyarm,nanopi-r76s", "rockchip,rk3576"' \
            target/linux/rockchip/dts/rk3576/rk3576-nanopi-r76s.dts

          grep -q \
            'define U-Boot/easepi-rk3576' \
            package/boot/uboot-rk35xx/Makefile

          grep -q \
            'define Device/Legacy' \
            target/linux/rockchip/image/Makefile

          test -f \
            target/linux/rockchip/image/legacy/default.bootscript

          echo
          echo "R76S prerequisites verified."

      - name: Fix R76S boot console
        run: |
          cd openwrt

          BOOT_SCRIPT="target/linux/rockchip/image/legacy/default.bootscript"

          echo "===== Boot script before patch ====="

          grep -n 'console=' "$BOOT_SCRIPT" || true

          sed -i \
            's/console=ttyS2,1500000/console=ttyS0,1500000/g' \
            "$BOOT_SCRIPT"

          echo
          echo "===== Boot script after patch ====="

          grep -n 'console=' "$BOOT_SCRIPT" || true

          grep -q \
            'console=ttyS0,1500000' \
            "$BOOT_SCRIPT"

          if grep -q \
            'console=ttyS2,1500000' \
            "$BOOT_SCRIPT"; then

            echo "ERROR: ttyS2 still exists."
            exit 1
          fi

          echo
          echo "R76S boot console verified: ttyS0."

      - name: Add R76S image profile
        run: |
          cd openwrt

          ARMV8_MK="target/linux/rockchip/image/armv8.mk"

          if grep -q \
            '^define Device/friendlyarm_nanopi-r76s$' \
            "$ARMV8_MK"; then

            echo "R76S profile already exists."

          else

            echo >> "$ARMV8_MK"

            cat >> "$ARMV8_MK" <<'EOF'

          define Device/friendlyarm_nanopi-r76s
            $(Device/Legacy)
            DEVICE_VENDOR := FriendlyARM
            DEVICE_MODEL := NanoPi R76S
            SOC := rk3576
            UBOOT_DEVICE_NAME := easepi-rk3576
            DEVICE_PACKAGES := kmod-r8169 kmod-rtw88-8822cs wpad-basic-mbedtls
          endef
          TARGET_DEVICES += friendlyarm_nanopi-r76s
          EOF


          echo
          echo "===== Final R76S profile ====="

          sed -n \
            '/define Device\/friendlyarm_nanopi-r76s/,/TARGET_DEVICES += friendlyarm_nanopi-r76s/p' \
            "$ARMV8_MK"

          grep -q \
            '^define Device/friendlyarm_nanopi-r76s$' \
            "$ARMV8_MK"

          grep -q \
            '^TARGET_DEVICES += friendlyarm_nanopi-r76s$' \
            "$ARMV8_MK"

          fi

      - name: Load official iStoreOS 24.10 feeds
        run: |
          cd openwrt

          curl -fL \
            --retry 3 \
            --retry-delay 3 \
            https://fw.koolcenter.com/iStoreOS/r76s/24.10-feeds.conf \
            -o feeds.conf

          test -s feeds.conf

          echo "===== feeds.conf ====="
          cat feeds.conf

      - name: Update feeds and stage current PassWall sources
        run: |
          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "===== Refresh Go toolchain for current PassWall cores ====="

          GO_DIR="feeds/packages/lang/golang"
          rm -rf "$GO_DIR"

          CLONED=0
          for attempt in 1 2 3; do
            echo "Go toolchain clone attempt: $attempt/3"

            if git -c http.version=HTTP/1.1 clone \
              --filter=blob:none \
              --depth=1 \
              --single-branch \
              --branch 26.x \
              https://github.com/sbwml/packages_lang_golang.git \
              "$GO_DIR"; then
              CLONED=1
              break
            fi

            rm -rf "$GO_DIR"
            sleep 5
          done

          if [ "$CLONED" -ne 1 ]; then
            echo "ERROR: Failed to clone Go 26.x toolchain after 3 attempts."
            exit 1
          fi

          test -f "$GO_DIR/golang/Makefile"
          test -f "$GO_DIR/golang-package.mk"
          test -f "$GO_DIR/golang-build.sh"

          echo "===== Remove conflicting/older proxy cores from OpenWrt feeds ====="

          rm -rf feeds/packages/net/xray-core
          rm -rf feeds/packages/net/v2ray-geodata
          rm -rf feeds/packages/net/sing-box
          rm -rf feeds/packages/net/chinadns-ng
          rm -rf feeds/packages/net/dns2socks
          rm -rf feeds/packages/net/hysteria
          rm -rf feeds/packages/net/ipt2socks
          rm -rf feeds/packages/net/microsocks
          rm -rf feeds/packages/net/naiveproxy
          rm -rf feeds/packages/net/shadowsocks-rust
          rm -rf feeds/packages/net/shadowsocksr-libev
          rm -rf feeds/packages/net/simple-obfs
          rm -rf feeds/packages/net/tcping
          rm -rf feeds/packages/net/v2ray-plugin
          rm -rf feeds/packages/net/xray-plugin
          rm -rf feeds/packages/net/geoview
          rm -rf feeds/packages/net/shadow-tls

          rm -rf feeds/luci/applications/luci-app-passwall

          rm -rf package/passwall-packages
          rm -rf package/passwall-luci

          echo "===== Clone PassWall package sources directly ====="

          PWPKG_OK=0
          for attempt in 1 2 3; do
            echo "PassWall packages clone attempt: $attempt/3"
            if git -c http.version=HTTP/1.1 clone \
              --filter=blob:none \
              --depth=1 \
              --single-branch \
              --branch main \
              https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git \
              package/passwall-packages; then
              PWPKG_OK=1
              break
            fi

            rm -rf package/passwall-packages
            sleep 5
          done

          if [ "$PWPKG_OK" -ne 1 ]; then
            echo "ERROR: Failed to clone openwrt-passwall-packages after 3 attempts."
            exit 1
          fi

          # Pin shadowsocks-rust to Rust-1.90-compatible v1.24.0
          # shadowsocks-rust 1.25.0 requires Rust >= 1.91
          # iStoreOS 24.10 currently provides rustc 1.90.0
          SS_RUST_MK="package/passwall-packages/shadowsocks-rust/Makefile"
          test -f "$SS_RUST_MK"

          echo "===== Pin shadowsocks-rust v1.24.0 ====="
          sed -i \
            -e 's/^PKG_VERSION:=.*/PKG_VERSION:=1.24.0/' \
            -e 's/^PKG_HASH:=.*/PKG_HASH:=a89865d1c5203de1b732017dd032e85f943d1592e8d3152eb7d2c4f3fca387bf/' \
            "$SS_RUST_MK"

          grep -qxF 'PKG_VERSION:=1.24.0' "$SS_RUST_MK"
          grep -qxF 'PKG_HASH:=a89865d1c5203de1b732017dd032e85f943d1592e8d3152eb7d2c4f3fca387bf' "$SS_RUST_MK"
          grep -E '^PKG_(VERSION|HASH):=' "$SS_RUST_MK"

          # Xray 26.9.8+ requires Go >= 1.27, while the OpenWrt 24.10
          # compatibility toolchain used here is Go 1.26.x. Keep Xray on
          # the last Go-1.26-compatible release so Sing-box can also remain
          # on the proven Go 1.26 toolchain.
          XRAY_MK="package/passwall-packages/xray-core/Makefile"
          test -f "$XRAY_MK"

          echo "===== Pin Xray to Go 1.26-compatible v26.7.28 ====="
          sed -i \
            -e 's/^PKG_VERSION:=.*/PKG_VERSION:=26.7.28/' \
            -e 's/^PKG_HASH:=.*/PKG_HASH:=a9afe86349c7bd3e6cae60125e62a5ada09d102e1a2760623e77c24a84dbfb46/' \
            "$XRAY_MK"

          grep -qxF 'PKG_VERSION:=26.7.28' "$XRAY_MK"
          grep -qxF 'PKG_HASH:=a9afe86349c7bd3e6cae60125e62a5ada09d102e1a2760623e77c24a84dbfb46' "$XRAY_MK"
          grep -E '^PKG_(VERSION|HASH):=' "$XRAY_MK"

          PWLUC_OK=0
          for attempt in 1 2 3; do
            echo "PassWall LuCI clone attempt: $attempt/3"
            if git -c http.version=HTTP/1.1 clone \
              --filter=blob:none \
              --depth=1 \
              --single-branch \
              --branch main \
              https://github.com/Openwrt-Passwall/openwrt-passwall.git \
              package/passwall-luci; then
              PWLUC_OK=1
              break
            fi

            rm -rf package/passwall-luci
            sleep 5
          done

          if [ "$PWLUC_OK" -ne 1 ]; then
            echo "ERROR: Failed to clone openwrt-passwall after 3 attempts."
            exit 1
          fi

          test -f package/passwall-luci/luci-app-passwall/Makefile

          echo "===== Clone PassWall2 LuCI source ====="

          PWLUC2_OK=0
          for attempt in 1 2 3; do
            echo "PassWall2 LuCI clone attempt: $attempt/3"

            if git -c http.version=HTTP/1.1 clone \
              --filter=blob:none \
              --depth=1 \
              --single-branch \
              --branch main \
              https://github.com/Openwrt-Passwall/openwrt-passwall2.git \
              package/passwall2-luci; then
              PWLUC2_OK=1
              break
            fi

            rm -rf package/passwall2-luci
            sleep 5
          done

          if [ "$PWLUC2_OK" -ne 1 ]; then
            echo "ERROR: Failed to clone openwrt-passwall2 after 3 attempts."
            exit 1
          fi

          test -f package/passwall2-luci/luci-app-passwall2/Makefile
          test -f package/passwall-packages/xray-core/Makefile
          test -f package/passwall-packages/sing-box/Makefile
          test -f package/passwall-packages/chinadns-ng/Makefile

      - name: Verify PassWall source defaults
        run: |
          cd openwrt

          PASSWALL_DIR="package/passwall-luci/luci-app-passwall"
          PASSWALL_MK="$PASSWALL_DIR/Makefile"
          PASSWALL_DEFAULT="$PASSWALL_DIR/root/usr/share/passwall/0_default_config"

          test -f "$PASSWALL_MK"
          test -f "$PASSWALL_DEFAULT"

          grep -q 'Nftables Transparent Proxy' "$PASSWALL_MK"
          grep -q 'PACKAGE_kmod-nft-socket' "$PASSWALL_MK"
          grep -q 'PACKAGE_kmod-nft-tproxy' "$PASSWALL_MK"
          grep -q 'PACKAGE_$(PKG_NAME)_INCLUDE_Xray' "$PASSWALL_MK"
          grep -q 'PACKAGE_$(PKG_NAME)_INCLUDE_SingBox' "$PASSWALL_MK"

          # Upstream package remains disabled in ROM; v2.2.6 first-boot defaults
          # enable only the verified node-free shunt framework.
          grep -q "option enabled '0'" "$PASSWALL_DEFAULT"

          PASSWALL_APP="$PASSWALL_DIR/root/usr/share/passwall/app.sh"
          test -f "$PASSWALL_APP"

          # The runtime DNS guard uses this stable anchor when a PassWall App
          # Update replaces app.sh. Fail before compilation if upstream changes
          # the layout instead of shipping an unpatchable image.
          grep -qF \
            'uci -q delete dhcp.@dnsmasq[0].min_cache_ttl' \
            "$PASSWALL_APP"

          test -f package/diy/luci-app-ota/Makefile


      - name: Stage official iStoreOS QuickStart UI
        run: |
          cd openwrt

          echo "===== Stage official iStoreOS QuickStart ====="

          # Use the official LinkEase/iStoreOS release sources directly.
          # Do not use the refactoring-only istoreos/quickstart repository;
          # its own README points release builds to these two package trees.
          rm -rf \
            /tmp/r76s-nas-packages \
            /tmp/r76s-nas-packages-luci \
            package/custom/quickstart \
            package/custom/luci-app-quickstart

          git clone \
            --depth=1 \
            --filter=blob:none \
            --sparse \
            --branch master \
            https://github.com/linkease/nas-packages.git \
            /tmp/r76s-nas-packages

          git -C /tmp/r76s-nas-packages sparse-checkout set \
            network/services/quickstart

          git clone \
            --depth=1 \
            --filter=blob:none \
            --sparse \
            --branch main \
            https://github.com/linkease/nas-packages-luci.git \
            /tmp/r76s-nas-packages-luci

          git -C /tmp/r76s-nas-packages-luci sparse-checkout set \
            luci/luci-app-quickstart

          mkdir -p package/custom

          cp -a \
            /tmp/r76s-nas-packages/network/services/quickstart \
            package/custom/quickstart

          cp -a \
            /tmp/r76s-nas-packages-luci/luci/luci-app-quickstart \
            package/custom/luci-app-quickstart

          test -f package/custom/quickstart/Makefile
          test -f package/custom/luci-app-quickstart/Makefile

          grep -q '^PKG_NAME:=quickstart$' \
            package/custom/quickstart/Makefile
          grep -q 'LUCI_DEPENDS:=+quickstart +luci-app-store' \
            package/custom/luci-app-quickstart/Makefile

          echo "===== Official QuickStart package versions ====="
          grep -E '^(PKG_NAME|PKG_VERSION|PKG_RELEASE):=' \
            package/custom/quickstart/Makefile || true
          grep -E '^(PKG_VERSION|PKG_RELEASE):=' \
            package/custom/luci-app-quickstart/Makefile || true

          echo "Official iStoreOS QuickStart sources staged."

      - name: Copy and fix R76S status package
        run: |
          mkdir -p openwrt/package/custom

          rm -rf \
            openwrt/package/custom/luci-app-r76s-status

          cp -r \
            feeds/luci-app-r76s-status \
            openwrt/package/custom/

          STATUS_DIR="openwrt/package/custom/luci-app-r76s-status"
          STATUS_CTRL="$STATUS_DIR/files/controller/r76s_status.lua"
          STATUS_VIEW="$STATUS_DIR/files/view/r76s_status/status.htm"

          test -f "$STATUS_DIR/Makefile"
          test -f "$STATUS_CTRL"
          test -f "$STATUS_VIEW"

          cat > "$STATUS_CTRL" <<'EOF_STATUS_CTRL'
          module("luci.controller.r76s_status", package.seeall)

          function index()
              local e = entry({"admin", "status", "r76s"}, call("action_status"), _("R76S 状态"), 90)
              e.dependent = false
          end

          local function trim(s)
              return (s or ""):gsub("%s+$", "")
          end

          local function running(cmd)
              local sys = require "luci.sys"
              return sys.call(cmd .. " >/dev/null 2>&1") == 0
          end

          function action_status()
              local sys = require "luci.sys"
              local data = {}

              data.model = "FriendlyElec NanoPi R76S"
              data.soc = "Rockchip RK3576"
              data.kernel = trim(sys.exec("uname -r 2>/dev/null"))
              data.arch = trim(sys.exec("uname -m 2>/dev/null"))
              data.uptime = trim(sys.exec("uptime 2>/dev/null"))
              data.load = trim(sys.exec("cut -d' ' -f1-3 /proc/loadavg 2>/dev/null"))
              data.mem = trim(sys.exec([[awk '/MemTotal:/{t=$2}/MemAvailable:/{a=$2} END{if(t>0){printf "%.0f / %.0f MB",(t-a)/1024,t/1024}}' /proc/meminfo 2>/dev/null]]))
              data.temp = trim(sys.exec("for f in /sys/class/thermal/thermal_zone*/temp; do [ -r \"$f\" ] && awk '{printf \"%.1f C\", $1/1000}' \"$f\" && break; done"))
              data.lan = trim(sys.exec("uci -q get network.lan.ipaddr 2>/dev/null"))
              data.wan = trim(sys.exec("ubus call network.interface.wan status 2>/dev/null | jsonfilter -e '@[\"ipv4-address\"][0].address' 2>/dev/null"))

              local smartdns_running = running("pgrep -f '[s]martdns'")
              local passwall_running = running("pgrep -f '/tmp/etc/passwall/'") or running("pgrep -f '[p]asswall/monitor.sh'")
              local passwall2_running = running("pgrep -f '/tmp/etc/passwall2/'") or running("pgrep -f '[p]asswall2/monitor.sh'")
              local adguard_running = running("pgrep -f '[A]dGuardHome'")

              data.smartdns = smartdns_running and "运行中" or "已停止"
              data.passwall = passwall_running and "运行中" or "已停止"
              data.passwall2 = passwall2_running and "运行中" or "已停止"
              data.adguard = adguard_running and "运行中" or "已停止"

              luci.template.render("r76s_status/status", { data = data })
          end
          EOF_STATUS_CTRL

          cat > "$STATUS_VIEW" <<'EOF_STATUS_VIEW'
          <%+header%>

          <style>
          .r76s-status-wrap{max-width:1080px;margin:0 auto}
          .r76s-status-card{background:var(--background-color-high,#fff);border:1px solid rgba(127,127,127,.22);border-radius:12px;padding:18px 20px;margin-top:14px}
          .r76s-status-card h3{margin-top:0}
          .r76s-status-table{width:100%;border-collapse:collapse}
          .r76s-status-table td{padding:9px 10px;border-bottom:1px solid rgba(127,127,127,.16)}
          .r76s-status-table td:first-child{width:180px;font-weight:600}
          .r76s-status-table tr:last-child td{border-bottom:0}
          </style>

          <div class="r76s-status-wrap">
            <h2>R76S 状态</h2>
            <div class="r76s-status-card">
              <h3>FriendlyElec NanoPi R76S / Rockchip RK3576</h3>
              <table class="r76s-status-table">
                <tr><td>设备</td><td><%=data.model%></td></tr>
                <tr><td>SoC</td><td><%=data.soc%></td></tr>
                <tr><td>架构</td><td><%=data.arch%></td></tr>
                <tr><td>内核</td><td><%=data.kernel%></td></tr>
                <tr><td>温度</td><td><%=data.temp%></td></tr>
                <tr><td>内存</td><td><%=data.mem%></td></tr>
                <tr><td>负载</td><td><%=data.load%></td></tr>
                <tr><td>LAN</td><td><%=data.lan%></td></tr>
                <tr><td>WAN</td><td><%=data.wan%></td></tr>
                <tr><td>运行时间</td><td><%=data.uptime%></td></tr>
                <tr><td>SmartDNS</td><td><%=data.smartdns%></td></tr>
                <tr><td>PassWall</td><td><%=data.passwall%></td></tr>
                <tr><td>PassWall2</td><td><%=data.passwall2%></td></tr>
                <tr><td>AdGuard Home</td><td><%=data.adguard%></td></tr>
              </table>
            </div>
          </div>

          <%+footer%>
          EOF_STATUS_VIEW

          grep -qF 'data.passwall2' "$STATUS_CTRL"
          grep -qF 'data.adguard' "$STATUS_CTRL"
          grep -qF 'MemAvailable' "$STATUS_CTRL"
          grep -qF 'PassWall2' "$STATUS_VIEW"
          grep -qF 'AdGuard Home' "$STATUS_VIEW"
      - name: Stage V2.2.6 component updater and SmartDNS Release48.4 runtime
        run: |
          mkdir -p openwrt/package/custom

          rm -rf openwrt/package/custom/luci-app-r76s-updater
          cp -r feeds/luci-app-r76s-updater openwrt/package/custom/

          UPDATER_DIR="openwrt/package/custom/luci-app-r76s-updater"
          SMARTDNS_TAG="Release48.4"
          SMARTDNS_ASSET="smartdns.1.2026.08.05-0921.aarch64-linux-all.tar.gz"
          SMARTDNS_URL="https://github.com/pymumu/smartdns/releases/download/${SMARTDNS_TAG}/${SMARTDNS_ASSET}"
          SMARTDNS_API="https://api.github.com/repos/pymumu/smartdns/releases/tags/${SMARTDNS_TAG}"

          echo "===== SmartDNS ${SMARTDNS_TAG}: official direct asset ====="
          echo "SmartDNS asset: $SMARTDNS_URL"

          # Do not make the build depend on the unauthenticated GitHub API.
          # The Release48.4 asset URL is deterministic; metadata is optional and
          # used only to obtain the upstream-published SHA256 when API access works.
          SMARTDNS_DIGEST=""
          rm -f /tmp/smartdns-release.json
          if curl -fsSL --retry 3 --retry-delay 3 \
            -H 'Accept: application/vnd.github+json' \
            -H 'User-Agent: R76S-V226-Build' \
            -H 'Authorization: Bearer ${{ github.token }}' \
            "$SMARTDNS_API" \
            -o /tmp/smartdns-release.json; then

            SMARTDNS_DIGEST="$(python3 - /tmp/smartdns-release.json "$SMARTDNS_ASSET" <<'PY_SD_META'
          import json, sys
          data = json.load(open(sys.argv[1], 'r', encoding='utf-8'))
          wanted = sys.argv[2]
          for asset in data.get('assets', []):
              if asset.get('name') == wanted:
                  print(asset.get('digest', '') or '')
                  break
          PY_SD_META
            )"
          else
            echo "WARNING: GitHub release metadata API unavailable; using official direct release asset."
          fi

          echo "SmartDNS digest: ${SMARTDNS_DIGEST:-metadata-unavailable}"

          curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
            "$SMARTDNS_URL" \
            -o /tmp/smartdns-aarch64.tar.gz

          test -s /tmp/smartdns-aarch64.tar.gz
          gzip -t /tmp/smartdns-aarch64.tar.gz

          if echo "$SMARTDNS_DIGEST" | grep -q '^sha256:'; then
            EXPECTED_SHA="${SMARTDNS_DIGEST#sha256:}"
            ACTUAL_SHA="$(sha256sum /tmp/smartdns-aarch64.tar.gz | awk '{print $1}')"
            [ "$EXPECTED_SHA" = "$ACTUAL_SHA" ] || {
              echo "ERROR: SmartDNS SHA256 mismatch."
              exit 1
            }
            echo "SmartDNS SHA256 verified: $ACTUAL_SHA"
          else
            echo "WARNING: Upstream SHA256 metadata unavailable; archive and aarch64 binary checks remain mandatory."
          fi

          rm -rf /tmp/smartdns-extract
          mkdir -p /tmp/smartdns-extract
          tar -xzf /tmp/smartdns-aarch64.tar.gz -C /tmp/smartdns-extract

          SMARTDNS_BIN="$(find /tmp/smartdns-extract -type f -name smartdns | head -n 1)"
          test -n "$SMARTDNS_BIN"

          file "$SMARTDNS_BIN" | grep -Eqi 'ARM aarch64|aarch64' || {
            echo "ERROR: SmartDNS runtime is not aarch64."
            file "$SMARTDNS_BIN"
            exit 1
          }

          install -m 0755 \
            "$SMARTDNS_BIN" \
            "$UPDATER_DIR/files/root/usr/libexec/r76s/smartdns.bin"

          CTRL="$UPDATER_DIR/files/controller/r76s_updater.lua"
          VIEW="$UPDATER_DIR/files/view/r76s_updater/index.htm"
          POLICY="$UPDATER_DIR/files/root/usr/libexec/r76s/r76s-smartdns-policy"
          BOOT_HOOK="$UPDATER_DIR/files/root/etc/init.d/r76s-fix3-boot"

          for required in \
            "$UPDATER_DIR/Makefile" \
            "$CTRL" \
            "$VIEW" \
            "$UPDATER_DIR/files/root/usr/libexec/r76s/r76s-component-updater" \
            "$POLICY" \
            "$BOOT_HOOK" \
            "$UPDATER_DIR/files/root/usr/libexec/r76s/smartdns.bin"; do
            test -s "$required"
          done

          echo "===== V2.2.6: remove automatic DNS takeover from component package ====="

          cat > "$POLICY" <<'EOF_POLICY'
          #!/bin/sh
          # R76S V2.2.6 policy: SmartDNS is user-controlled.
          # Component updates must not rewrite DNS, WAN, dnsmasq or user settings.
          exit 0
          EOF_POLICY
          chmod 0755 "$POLICY"

          cat > "$BOOT_HOOK" <<'EOF_BOOT_HOOK'
          #!/bin/sh /etc/rc.common
          # R76S V2.2.6: intentionally no automatic DNS/proxy configuration.
          # User-enabled services keep their own normal init/procd state.
          START=99
          STOP=10
          USE_PROCD=1

          start_service() {
              return 0
          }

          stop_service() {
              return 0
          }
          EOF_BOOT_HOOK
          chmod 0755 "$BOOT_HOOK"

          echo "===== V2.2.6: patch firmware OTA controller ====="

          python3 - "$CTRL" <<'PY_OTA_PATCH'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          t = p.read_text()

          t = t.replace('-- R76S_UPDATER_UI_PATCH=3', '-- R76S_UPDATER_UI_PATCH=4')

          old_return = '    return rc, trim(out)'
          new_return = "\n".join([
              '    -- /bin/ota download starts an asynchronous curl job. Some builds',
              '    -- return a non-zero launcher rc even though the download is alive.',
              '    if cmd:find("/bin/ota download", 1, true) and rc ~= 0 then',
              '        sys.call("sleep 1")',
              '        local active = fs.access("/tmp/firmware.img.part")',
              '            or sys.call("pgrep -f \'[/]bin/ota\' >/dev/null 2>&1") == 0',
              '            or sys.call("pgrep -f \'[c]url.*firmware.img\' >/dev/null 2>&1") == 0',
              '        if active then',
              '            rc = 0',
              '            if trim(out) == "" then',
              '                out = "下载任务已启动"',
              '            end',
              '        end',
              '    end',
              '    return rc, trim(out)',
          ])
          if old_return not in t:
              raise SystemExit('ERROR: run_with_rc return anchor not found in updater controller')
          t = t.replace(old_return, new_return, 1)

          old_download = "\n".join([
              '    elseif progress_exists then',
              '        state = "failed"',
              '        message = trim(progress_text:match("([^\\r\\n]+)%s*$") or "下载失败")',
          ])
          new_download = "\n".join([
              '    elseif progress_exists and (',
              '        sys.call("pgrep -f \'[/]bin/ota\' >/dev/null 2>&1") == 0',
              '        or sys.call("pgrep -f \'[c]url.*firmware.img\' >/dev/null 2>&1") == 0',
              '    ) then',
              '        state = "downloading"',
              '        message = "正在下载"',
              '    elseif progress_exists then',
              '        state = "failed"',
              '        message = trim(progress_text:match("([^\\r\\n]+)%s*$") or "下载失败")',
          ])
          if old_download not in t:
              raise SystemExit('ERROR: download_info progress anchor not found in updater controller')
          t = t.replace(old_download, new_download, 1)

          old_safe = '    local safe = (dev == "mmcblk0" or dev == "mmcblk2") and romdev:find("/dev/" .. dev, 1, true) == 1'
          new_safe = "\n".join([
              '    -- /rom can be /dev/root; resolve root=PARTUUID through blkid first.',
              '    local resolved_root = romdev',
              '    if romdev == "/dev/root" or romdev == "rootfs" then',
              '        local cmdline = readfile("/proc/cmdline")',
              '        local partuuid = cmdline:match("root=PARTUUID=([%w%-]+)")',
              '        if partuuid and partuuid ~= "" then',
              '            resolved_root = trim(sys.exec(',
              '                "blkid 2>/dev/null | grep -i \'PARTUUID=\\\"" .. partuuid .. "\\\"\' | head -n1 | cut -d: -f1"',
              '            ))',
              '        end',
              '    end',
              '',
              '    local allowed = (dev == "mmcblk0" or dev == "mmcblk2")',
              '    local expected = dev ~= "" and ("/dev/" .. dev) or ""',
              '    local safe = allowed and expected ~= "" and (',
              '        romdev:find(expected, 1, true) == 1',
              '        or (resolved_root ~= "" and resolved_root:find(expected, 1, true) == 1)',
              '    )',
          ])
          if old_safe not in t:
              raise SystemExit('ERROR: boot_info safety anchor not found in updater controller')
          t = t.replace(old_safe, new_safe, 1)

          if 'sysupgrade -n' in t or '/sbin/sysupgrade -n' in t:
              raise SystemExit('ERROR: updater would erase settings by default (sysupgrade -n found)')
          if '/sbin/sysupgrade " .. FIRMWARE' not in t:
              raise SystemExit('ERROR: expected preserve-config sysupgrade install command not found')

          p.write_text(t)
          PY_OTA_PATCH

          echo "===== V2.2.6: center OTA page and show preserve-config notice ====="

          python3 - "$VIEW" <<'PY_OTA_VIEW'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          t = p.read_text()
          marker = 'R76S_V226_LAYOUT'
          if marker not in t:
              extra = '''
          <!-- R76S_V226_LAYOUT -->
          <style>
          #maincontent .cbi-map{max-width:1080px;margin-left:auto!important;margin-right:auto!important}
          #maincontent .cbi-section{box-sizing:border-box}
          #maincontent .cbi-value-field{max-width:none}
          @media (min-width:900px){#maincontent .cbi-section{padding-left:18px;padding-right:18px}}
          </style>
          <div style="max-width:1080px;margin:12px auto 0;padding:10px 14px;border-radius:8px;background:rgba(127,127,127,.10)">
            在线升级默认保留当前网络、密码和插件配置；不会使用 <code>sysupgrade -n</code> 清空配置。
          </div>
          '''
              if '<%+footer%>' in t:
                  t = t.replace('<%+footer%>', extra + '\n<%+footer%>', 1)
              else:
                  t += '\n' + extra
          p.write_text(t)
          PY_OTA_VIEW

          grep -qF 'R76S_UPDATER_UI_PATCH=4' "$CTRL"
          grep -qF 'root=PARTUUID' "$CTRL"
          grep -qF 'firmware.img.part' "$CTRL"
          grep -qF '下载任务已启动' "$CTRL"
          grep -qF 'R76S_V226_LAYOUT' "$VIEW"
          grep -qF '默认保留当前网络、密码和插件配置' "$VIEW"
          ! grep -qF 'sysupgrade -n' "$CTRL"
          grep -qF 'R76S V2.2.6 policy: SmartDNS is user-controlled.' "$POLICY"
          grep -qF 'intentionally no automatic DNS/proxy configuration' "$BOOT_HOOK"

          if grep -RnsE 'sysupgrade|dd[[:space:]].*of=/dev/|mmcblk[0-9]|partx[[:space:]]|fdisk[[:space:]]|sfdisk[[:space:]]|blkdiscard' \
            "$UPDATER_DIR/files/root"; then
            echo "ERROR: forbidden firmware/block-device operation in component updater."
            exit 1
          fi

          PKG_MK="$UPDATER_DIR/Makefile"
          grep -qF '$(INSTALL_BIN)' "$PKG_MK"

      - name: Install R76S v2.2.6 clean defaults and OTA source safely
        run: |
          echo "===== V2.2.6 clean-flash policy ====="
          echo "WAN: upstream iStoreOS default DHCP client"
          echo "DNS: dnsmasq uses WAN DNS by default"
          echo "PassWall/PassWall2/SmartDNS/AdGuard Home: installed but not forced on"
          echo "Preserved sysupgrade settings must override ROM defaults"

          echo "===== Set clean-image default root password ====="
          SHADOW="openwrt/package/base-files/files/etc/shadow"
          test -f "$SHADOW"
          PASSWORD_HASH="$(openssl passwd -6 -salt R76Sv226 password)"
          test -n "$PASSWORD_HASH"
          sed -i "s#^root:[^:]*:#root:${PASSWORD_HASH}:#" "$SHADOW"
          grep -q '^root:\$6\$R76Sv226\$' "$SHADOW"

          echo "===== Keep PassWall and PassWall2 disabled in ROM defaults ====="
          PW1_DEFAULT="openwrt/package/passwall-luci/luci-app-passwall/root/usr/share/passwall/0_default_config"
          PW2_DEFAULT="openwrt/package/passwall2-luci/luci-app-passwall2/root/usr/share/passwall2/0_default_config"
          test -f "$PW1_DEFAULT"
          grep -q "option enabled '0'" "$PW1_DEFAULT"

          if [ -f "$PW2_DEFAULT" ]; then
            if ! grep -q "option enabled '0'" "$PW2_DEFAULT"; then
              sed -i "0,/option enabled '1'/s//option enabled '0'/" "$PW2_DEFAULT"
            fi
            grep -q "option enabled '0'" "$PW2_DEFAULT"
          else
            echo "ERROR: PassWall2 default config not found: $PW2_DEFAULT"
            exit 1
          fi

          echo "===== Keep SmartDNS default disabled and stop automatic dnsmasq takeover ====="
          python3 - <<'PY_SERVICE_DEFAULTS'
          from pathlib import Path
          import re

          roots = [Path('openwrt/feeds'), Path('openwrt/package')]
          smartdns_candidates = []
          adguard_candidates = []

          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*'):
                  if not p.is_file():
                      continue
                  sp = str(p).lower()
                  if '/root/etc/config/' not in sp and not sp.endswith('smartdns.config'):
                      continue
                  try:
                      text = p.read_text(errors='ignore')
                  except Exception:
                      continue
                  if 'smartdns' in sp and re.search(r'^\s*config\s+smartdns\b', text, re.M):
                      smartdns_candidates.append(p)
                  if 'adguard' in sp and re.search(r'^\s*config\s+', text, re.M):
                      adguard_candidates.append(p)

          patched_sd = 0
          for p in smartdns_candidates:
              text = p.read_text(errors='ignore')
              new = re.sub(
                  r"(?ms)(^\s*config\s+smartdns\b.*?^\s*option\s+enabled\s+)'1'",
                  r"\g<1>'0'",
                  text,
                  count=1,
              )
              new = re.sub(
                  r"(?ms)(^\s*config\s+smartdns\b.*?^\s*option\s+auto_set_dnsmasq\s+)'1'",
                  r"\g<1>'0'",
                  new,
                  count=1,
              )
              if new != text:
                  p.write_text(new)
                  patched_sd += 1
                  print('patched SmartDNS default:', p)

          patched_ag = 0
          for p in adguard_candidates:
              text = p.read_text(errors='ignore')
              new = re.sub(
                  r"(?m)(^\s*option\s+(?:enabled|enable)\s+)'1'",
                  r"\g<1>'0'",
                  text,
                  count=1,
              )
              if new != text:
                  p.write_text(new)
                  patched_ag += 1
                  print('patched AdGuard default:', p)

          print('SmartDNS candidates:', len(smartdns_candidates), 'patched:', patched_sd)
          print('AdGuard UCI candidates:', len(adguard_candidates), 'patched:', patched_ag)
          PY_SERVICE_DEFAULTS

          # Do not copy the old 99-r76s-v2-defaults script. It forced LAN/DNS/
          # AdGuard/SmartDNS/PassWall policy and could overwrite preserved state.
          rm -rf openwrt/files
          mkdir -p openwrt/files/lib/upgrade

          cat > openwrt/files/lib/upgrade/ota.sh <<EOF
          #!/bin/sh

          export_ota_url() {
              OTA_URL_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download"
          }
          EOF

          chmod 0755 openwrt/files/lib/upgrade/ota.sh
          test -x openwrt/files/lib/upgrade/ota.sh

          grep -qF \
            "github.com/${GITHUB_REPOSITORY}/releases/latest/download" \
            openwrt/files/lib/upgrade/ota.sh

          echo "===== Files injected into rootfs ====="
          find openwrt/files -type f -print | sort

          for bad in \
            openwrt/files/etc/config/network \
            openwrt/files/etc/config/system \
            openwrt/files/etc/config/dhcp \
            openwrt/files/etc/config/firewall \
            openwrt/files/etc/config/smartdns \
            openwrt/files/etc/config/passwall \
            openwrt/files/etc/config/passwall2 \
            openwrt/files/etc/config/adguardhome \
            openwrt/files/etc/AdGuardHome/AdGuardHome.yaml; do
            if [ -e "$bad" ]; then
              echo "ERROR: forbidden forced rootfs configuration detected: $bad"
              exit 1
            fi
          done

          if find openwrt/files/etc/uci-defaults -type f -print -quit 2>/dev/null | grep -q .; then
            echo "ERROR: V2.2.6 must not ship a first-boot script that rewrites user configuration."
            exit 1
          fi

          if grep -RnsE '127\.0\.0\.1#(3053|6053)|passwall\.myshunt|R76S_EXTERNAL_DNS_BEGIN|noresolv' openwrt/files 2>/dev/null; then
            echo "ERROR: forced DNS/PassWall policy leaked into rootfs overlay files."
            exit 1
          fi

          FILE_COUNT=$(find openwrt/files -type f | wc -l)
          if [ "$FILE_COUNT" -ne 1 ]; then
            echo "ERROR: unexpected files were injected into openwrt/files."
            find openwrt/files -type f -print
            exit 1
          fi

          echo "R76S v2.2.6 clean defaults verified safely."
      - name: Verify R76S status package
        run: |
          echo "===== R76S custom package ====="

          find \
            openwrt/package/custom/luci-app-r76s-status \
            -maxdepth 4 \
            -type f \
            -print

          grep -q \
            'Rockchip RK3576' \
            openwrt/package/custom/luci-app-r76s-status/files/view/r76s_status/status.htm

          grep -qF 'PassWall2' \
            openwrt/package/custom/luci-app-r76s-status/files/view/r76s_status/status.htm
          grep -qF 'AdGuard Home' \
            openwrt/package/custom/luci-app-r76s-status/files/view/r76s_status/status.htm
          grep -qF "pgrep -f '[s]martdns'" \
            openwrt/package/custom/luci-app-r76s-status/files/controller/r76s_status.lua
          grep -qF "pgrep -f '/tmp/etc/passwall/'" \
            openwrt/package/custom/luci-app-r76s-status/files/controller/r76s_status.lua

          grep -q \
            'view/r76s_status/\*' \
            openwrt/package/custom/luci-app-r76s-status/Makefile

          echo
          echo "R76S status page verified."

      - name: Apply R76S config and verify v2.2.6 selections
        run: |
          cd openwrt

          cp ../config/R76S.config .config

          echo "===== Input R76S.config PassWall selections ====="
          grep -E \
            '^CONFIG_PACKAGE_(luci-app-passwall|chinadns-ng|xray-core|sing-box|kmod-nft-(socket|tproxy)|firewall4)' \
            .config \
            || true

          # The repository config is the single source of truth.
          # Do not call ./scripts/config here: in OpenWrt this path is a
          # directory containing Kconfig helper sources, not an executable.
          for required in \
            'CONFIG_PACKAGE_firewall4=y' \
            'CONFIG_PACKAGE_dnsmasq-full=y' \
            'CONFIG_PACKAGE_luci-app-ota=y' \
            'CONFIG_PACKAGE_luci-app-package-manager=y' \
            'CONFIG_PACKAGE_luci-app-r76s-updater=y' \
            'CONFIG_PACKAGE_quickstart=y' \
            'CONFIG_PACKAGE_luci-app-quickstart=y' \
            'CONFIG_PACKAGE_luci-i18n-quickstart-zh-cn=y' \
            'CONFIG_PACKAGE_kmod-tun=y' \
            'CONFIG_PACKAGE_luci-app-passwall=y' \
            'CONFIG_PACKAGE_luci-app-passwall2=y' \
            'CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y' \
            'CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y' \
            'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview=y' \
            'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y' \
            'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geodata=y' \
            'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y' \
            'CONFIG_PACKAGE_chinadns-ng=y' \
            'CONFIG_PACKAGE_kmod-nft-socket=y' \
            'CONFIG_PACKAGE_kmod-nft-tproxy=y'; do
            if ! grep -qxF "$required" .config; then
              echo "ERROR: Required v2.2.6 selection missing from config/R76S.config:"
              echo "$required"
              exit 1
            fi
          done

          make defconfig

          echo
          echo "===== Final PassWall selections after make defconfig ====="
          grep -E \
            '^CONFIG_PACKAGE_(luci-app-passwall|chinadns-ng|xray-core|sing-box|kmod-nft-(socket|tproxy)|firewall4)' \
            .config \
            || true

          if ! grep -qxF 'CONFIG_PACKAGE_luci-app-passwall=y' .config; then
            echo "ERROR: luci-app-passwall was removed by make defconfig."
            echo
            echo "===== PassWall package definition ====="
            sed -n '1,190p' package/passwall-luci/luci-app-passwall/Makefile 2>/dev/null || true
            echo
            echo "===== Kconfig block for luci-app-passwall ====="
            LINE=$(
              grep -n '^config PACKAGE_luci-app-passwall$' \
                tmp/.config-package.in 2>/dev/null \
                | head -n 1 \
                | cut -d: -f1
            )
            if [ -n "$LINE" ]; then
              START=$((LINE > 12 ? LINE - 12 : 1))
              END=$((LINE + 35))
              sed -n "${START},${END}p" tmp/.config-package.in
            else
              echo "PACKAGE_luci-app-passwall symbol was not generated."
              echo
            echo "===== Direct dependency symbols ====="
            grep -E \
              '^(config PACKAGE_(coreutils|coreutils-base64|coreutils-nohup|coreutils-timeout|curl|chinadns-ng|dns2socks|dnsmasq-full|ip-full|libuci-lua|lua|luci-compat|luci-lib-jsonc|microsocks|resolveip|tcping|lyaml)|# CONFIG_PACKAGE_(coreutils|coreutils-base64|coreutils-nohup|coreutils-timeout|curl|chinadns-ng|dns2socks|dnsmasq-full|ip-full|libuci-lua|lua|luci-compat|luci-lib-jsonc|microsocks|resolveip|tcping|lyaml))' \
              .config tmp/.config-package.in 2>/dev/null \
              | head -n 250 \
              || true
            fi
            exit 1
          fi

      - name: Verify final R76S configuration
        run: |
          cd openwrt

          echo "===== TARGET ====="

          grep -E \
            '^CONFIG_TARGET_(rockchip|rockchip_armv8)' \
            .config

          echo
          echo "===== DEVICE ====="

          grep \
            '^CONFIG_TARGET_rockchip_armv8_DEVICE_.*=y$' \
            .config \
            || true

          echo
          echo "===== PARTITIONS ====="

          grep -E \
            '^CONFIG_TARGET_(KERNEL_PARTSIZE|ROOTFS_PARTSIZE)=' \
            .config

          echo
          echo "===== ROOTFS ====="

          grep -E \
            '^CONFIG_TARGET_ROOTFS_|^# CONFIG_TARGET_ROOTFS_' \
            .config \
            || true

          for required in \
            'CONFIG_TARGET_rockchip=y' \
            'CONFIG_TARGET_rockchip_armv8=y' \
            'CONFIG_TARGET_rockchip_armv8_DEVICE_friendlyarm_nanopi-r76s=y' \
            'CONFIG_TARGET_KERNEL_PARTSIZE=64' \
            'CONFIG_TARGET_ROOTFS_PARTSIZE=256' \
            'CONFIG_TARGET_ROOTFS_SQUASHFS=y' \
            '# CONFIG_TARGET_ROOTFS_EXT4FS is not set' \
            'CONFIG_PACKAGE_luci-app-r76s-status=y' \
            'CONFIG_PACKAGE_luci-app-r76s-updater=y' \
            'CONFIG_PACKAGE_quickstart=y' \
            'CONFIG_PACKAGE_luci-app-quickstart=y' \
            'CONFIG_PACKAGE_luci-i18n-quickstart-zh-cn=y' \
            'CONFIG_PACKAGE_luci-theme-argon=y' \
            'CONFIG_PACKAGE_luci-app-ota=y' \
            'CONFIG_PACKAGE_luci-app-package-manager=y' \
            'CONFIG_PACKAGE_kmod-tun=y' \
            'CONFIG_PACKAGE_smartdns=y' \
            'CONFIG_PACKAGE_luci-app-smartdns=y' \
            'CONFIG_PACKAGE_luci-i18n-smartdns-zh-cn=y' \
            'CONFIG_PACKAGE_adguardhome=y' \
            'CONFIG_PACKAGE_dockerd=y' \
            'CONFIG_PACKAGE_luci-app-dockerman=y' \
            'CONFIG_PACKAGE_luci-app-passwall=y' \
            'CONFIG_PACKAGE_luci-app-passwall2=y' \
            'CONFIG_PACKAGE_luci-i18n-passwall2-zh-cn=y' \
            'CONFIG_PACKAGE_luci-app-passwall_Nftables_Transparent_Proxy=y' \
            'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y' \
            'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y' \
            'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Geoview=y' \
            'CONFIG_PACKAGE_luci-app-passwall_INCLUDE_V2ray_Geodata=y' \
            'CONFIG_PACKAGE_kmod-nft-socket=y' \
            'CONFIG_PACKAGE_kmod-nft-tproxy=y' \
            'CONFIG_PACKAGE_chinadns-ng=y' \
            'CONFIG_PACKAGE_xray-core=y' \
            'CONFIG_PACKAGE_sing-box=y'; do
            if ! grep -qxF "$required" .config; then
              echo "ERROR: required config missing after defconfig: $required"
              exit 1
            fi
          done

          echo
          echo "===== PASSWALL ====="
          grep -E \
            '^CONFIG_PACKAGE_(luci-app-passwall|chinadns-ng|xray-core|sing-box|kmod-nft-(socket|tproxy))' \
            .config \
            | sort

          DEVICE_COUNT=$(
            grep -c \
              '^CONFIG_TARGET_rockchip_armv8_DEVICE_.*=y$' \
              .config \
              || true
          )

          echo
          echo "Enabled device count: $DEVICE_COUNT"

          if [ "$DEVICE_COUNT" -ne 1 ]; then
            echo "ERROR: Exactly one Rockchip device must be selected."
            exit 1
          fi

          echo
          echo "R76S v2.2.6 configuration verified successfully."

      - name: Build firmware
        run: |
          cd openwrt

          JOBS="$(nproc)"
          echo "===== Build with $JOBS parallel jobs + ccache ====="

          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 5G >/dev/null 2>&1 || true
          ccache -z >/dev/null 2>&1 || true

          if ! make -j"$JOBS"; then
            echo "Parallel build failed; retrying once with -j1 V=s for diagnosis."
            make -j1 V=s
          fi

          ccache -s || true

      - name: Locate R76S firmware
        run: |
          TARGET_DIR="openwrt/bin/targets/rockchip/armv8"

          echo "===== Build output ====="

          find \
            "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' \
            | sort

          CUSTOM_IMAGE=$(
            find \
              "$TARGET_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*friendlyarm_nanopi-r76s*squashfs*.img.gz' \
              | head -n 1
          )

          if [ -z "$CUSTOM_IMAGE" ]; then
            echo "ERROR: R76S image not found."
            exit 1
          fi

          echo
          echo "Found:"
          echo "$CUSTOM_IMAGE"

          echo "CUSTOM_IMAGE=$CUSTOM_IMAGE" >> "$GITHUB_ENV"
          echo "TARGET_DIR=$TARGET_DIR" >> "$GITHUB_ENV"

      - name: Patch R76S bootloader
        run: |
          RAW_IMAGE="/tmp/R76S-Custom-v2.2.6.img"
          STRIPPED_IMAGE="/tmp/R76S-Custom-v2.2.6-stripped.img.gz"
          SYSUPGRADE_META="/tmp/R76S-Custom-v2.2.6.sysupgrade.meta"
          FWTOOL="$GITHUB_WORKSPACE/openwrt/staging_dir/host/bin/fwtool"

          test -x "$FWTOOL"
          cp -f "$CUSTOM_IMAGE" "$STRIPPED_IMAGE"

          echo "===== Preserve and strip OpenWrt sysupgrade metadata ====="
          rm -f "$SYSUPGRADE_META" /tmp/r76s-build.ucert
          "$FWTOOL" -s /tmp/r76s-build.ucert -t "$STRIPPED_IMAGE" >/dev/null 2>&1 || true
          "$FWTOOL" -i "$SYSUPGRADE_META" -t "$STRIPPED_IMAGE"
          test -s "$SYSUPGRADE_META"

          python3 - "$SYSUPGRADE_META" <<'PY_META'
          import json, sys
          p=sys.argv[1]
          with open(p, 'r', encoding='utf-8') as f: meta=json.load(f)
          if 'friendlyarm,nanopi-r76s' not in meta.get('supported_devices', []):
              raise SystemExit('ERROR: source sysupgrade metadata lacks friendlyarm,nanopi-r76s')
          meta['metadata_version']='1.1'
          meta['compat_version']=meta.get('compat_version','1.0')
          v=meta.setdefault('version',{})
          v.update({'dist':'iStoreOS','version':'24.10.8','revision':'V2.2.6','target':'rockchip/armv8','board':'friendlyarm,nanopi-r76s'})
          with open(p,'w',encoding='utf-8') as f:
              json.dump(meta,f,ensure_ascii=False,separators=(',',':')); f.write('\n')
          PY_META
          cat "$SYSUPGRADE_META"

          gzip -t "$STRIPPED_IMAGE"
          echo "===== Decompress stripped custom image ====="
          gzip -dc "$STRIPPED_IMAGE" > "$RAW_IMAGE"
          test -s "$RAW_IMAGE"
          echo "SYSUPGRADE_META=$SYSUPGRADE_META" >> "$GITHUB_ENV"
          echo "FWTOOL=$FWTOOL" >> "$GITHUB_ENV"

          echo
          echo "===== Preserve first 32KB hash ====="

          FIRST32_BEFORE=$(
            dd \
              if="$RAW_IMAGE" \
              bs=512 \
              count=64 \
              status=none \
              | md5sum \
              | awk '{print $1}'
          )

          echo "First 32KB before: $FIRST32_BEFORE"

          echo
          echo "===== Current custom bootloader ====="

          CUSTOM_BOOT_BEFORE=$(
            dd \
              if="$RAW_IMAGE" \
              bs=512 \
              skip=64 \
              count=32704 \
              status=none \
              | md5sum \
              | awk '{print $1}'
          )

          echo "Custom bootloader before: $CUSTOM_BOOT_BEFORE"

          echo
          echo "===== Patch official bootloader into custom image ====="

          dd \
            if="$BOOT_BIN" \
            of="$RAW_IMAGE" \
            bs=512 \
            seek=64 \
            count=32704 \
            conv=notrunc,fsync \
            status=progress

          sync

          echo
          echo "===== Verify bootloader after patch ====="

          PATCHED_BOOT=$(
            dd \
              if="$RAW_IMAGE" \
              bs=512 \
              skip=64 \
              count=32704 \
              status=none \
              | md5sum \
              | awk '{print $1}'
          )

          echo "Patched bootloader: $PATCHED_BOOT"
          echo "Expected bootloader: $BOOT_MD5"

          if [ "$PATCHED_BOOT" != "$BOOT_MD5" ]; then
            echo "ERROR: Bootloader patch verification failed."
            exit 1
          fi
          echo
          echo "===== Verify first 32KB was NOT modified ====="

          FIRST32_AFTER=$(
            dd \
              if="$RAW_IMAGE" \
              bs=512 \
              count=64 \
              status=none \
              | md5sum \
              | awk '{print $1}'
          )

          echo "First 32KB before: $FIRST32_BEFORE"
          echo "First 32KB after:  $FIRST32_AFTER"

          if [ "$FIRST32_BEFORE" != "$FIRST32_AFTER" ]; then
            echo "ERROR: Partition table area was modified."
            exit 1
          fi
          echo
          echo "===== Partition table ====="

          fdisk -l "$RAW_IMAGE"

          echo "RAW_IMAGE=$RAW_IMAGE" >> "$GITHUB_ENV"

      - name: Create final v2.2.6 image and OTA metadata
        run: |
          RELEASE_DIR="$TARGET_DIR/release-v2.2.6"

          FINAL_NAME="R76S-Custom-v2.2.6-TF-squashfs.img.gz"
          FINAL_IMAGE="$RELEASE_DIR/$FINAL_NAME"

          mkdir -p "$RELEASE_DIR"

          echo "===== Compress final patched image ====="

          pigz -9 -c \
            "$RAW_IMAGE" \
            > "$FINAL_IMAGE"

          # Verify gzip payload BEFORE appending fwtool metadata.
          gzip -t "$FINAL_IMAGE"

          echo
          echo "===== Restore OpenWrt sysupgrade metadata ====="
          test -x "$FWTOOL"
          test -s "$SYSUPGRADE_META"
          "$FWTOOL" -I "$SYSUPGRADE_META" "$FINAL_IMAGE"

          FINAL_META_CHECK="/tmp/R76S-Custom-v2.2.6.final.meta"
          rm -f "$FINAL_META_CHECK"
          "$FWTOOL" -i "$FINAL_META_CHECK" "$FINAL_IMAGE"
          test -s "$FINAL_META_CHECK"
          python3 - "$FINAL_META_CHECK" <<'PY_FINAL_META'
          import json, sys
          with open(sys.argv[1], 'r', encoding='utf-8') as f: meta=json.load(f)
          if 'friendlyarm,nanopi-r76s' not in meta.get('supported_devices', []):
              raise SystemExit('ERROR: final metadata lacks R76S support')
          v=meta.get('version',{})
          exp={'dist':'iStoreOS','version':'24.10.8','revision':'V2.2.6','target':'rockchip/armv8'}
          for k,val in exp.items():
              if v.get(k) != val: raise SystemExit(f'ERROR: metadata {k}={v.get(k)!r}, expected {val!r}')
          PY_FINAL_META
          cat "$FINAL_META_CHECK"

          echo
          echo "===== SHA256 ====="

          cd "$RELEASE_DIR"

          FINAL_SHA="$(
            sha256sum "$FINAL_NAME" | awk '{print $1}'
          )"

          printf '%s  %s\n' \
            "$FINAL_SHA" \
            "$FINAL_NAME" \
            | tee sha256sums

          # iStoreOS luci-app-ota reads version.latest/version.index from the
          # device-specific OTA_URL_BASE. Our ota.sh points that base to this
          # repository's latest GitHub Release assets.
          cat > version.latest <<EOF
          [24.10.8-V2.2.6]($FINAL_NAME)
          R76S Custom V2.2.6 / RK3576 / TF
          SHA256: $FINAL_SHA
          EOF

          cat > version.index <<'EOF'
          24.10.8-V2.2.6
          EOF

          cat > ota.footer.html <<'EOF'
          <p>R76S Custom OTA: TF-first / eMMC-fallback boot policy. Online upgrade preserves configuration by default.</p>
          EOF

          printf '%s\n' \
            'R76S Custom v2.2.6 OTA / PassWall2 / PassWall' \
            '' \
            'Target:' \
            'rockchip/armv8' \
            '' \
            'Device:' \
            'FriendlyElec NanoPi R76S' \
            '' \
            'SoC:' \
            'Rockchip RK3576' \
            '' \
            'Bootloader source:' \
            'iStoreOS 24.10.8-2026073111 R76S' \
            '' \
            'Patched range:' \
            '32KB - 16MB' \
            '' \
            "Bootloader MD5: $BOOT_MD5" \
            '' \
            'The first 32KB of the custom image is preserved.' \
            '' \
            'v2.2.6 features:' \
            'LAN: iStoreOS upstream default' \
            'WAN clean default: DHCP client' \
            'DHCP/DNS: dnsmasq uses WAN DNS without forced SmartDNS/AdGuard chain' \
            'LuCI theme: Argon' \
            'System login clean default: root / password' \
            'PassWall: installed, clean default disabled, user settings persist' \
            'PassWall2: installed, clean default disabled, user settings persist' \
            'SmartDNS: bundled Release48.4 runtime, clean default disabled/user-controlled' \
            'AdGuard Home: installed, clean default disabled and not preconfigured by R76S custom scripts' \
            'Enabled services keep normal init/procd state across reboot/power loss' \
            'Online firmware upgrade: preserves existing configuration by default' \
            'OTA fixes: async download state + PARTUUID boot safety + centered UI' \
            'R76S status fixes: SmartDNS/PassWall/PassWall2/AdGuard runtime state + memory units' \
            'Xray core: pinned to 26.7.28 for Go 1.26 compatibility' \
            'PassWall transparent proxy: nftables' \
            'PassWall cores: Xray + Sing-box' \
            'QuickStart: official iStoreOS UI unchanged' \
            'UU accelerator: not included' \
            'Firmware OTA: GitHub Releases latest/download' \
            'Component online update: PassWall + PassWall2 + SmartDNS + AdGuard Home without forced DNS reset' \
            'Boot policy: TF-first / eMMC fallback' \
            > BOOTLOADER_INFO.txt

          echo
          echo "===== Final image and OTA metadata ====="

          ls -lh \
            "$FINAL_NAME" \
            sha256sums \
            version.latest \
            version.index \
            ota.footer.html \
            BOOTLOADER_INFO.txt

      - name: Copy build metadata
        run: |
          RELEASE_DIR="$TARGET_DIR/release-v2.2.6"

          for file in \
            config.buildinfo \
            feeds.buildinfo \
            version.buildinfo \
            profiles.json; do

            if [ -f "$TARGET_DIR/$file" ]; then
              cp \
                "$TARGET_DIR/$file" \
                "$RELEASE_DIR/"

          fi
          done

          find \
            "$TARGET_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*friendlyarm_nanopi-r76s*.manifest' \
            -exec cp {} "$RELEASE_DIR/" \; \
            || true

      - name: Final verification
        run: |
          RELEASE_DIR="$TARGET_DIR/release-v2.2.6"

          FINAL_IMAGE="$RELEASE_DIR/R76S-Custom-v2.2.6-TF-squashfs.img.gz"

          echo "===== Final verification ====="

          test -s "$FINAL_IMAGE"

          echo "===== Verify final sysupgrade metadata ====="
          FINAL_META="/tmp/R76S-Custom-v2.2.6.verify.meta"
          FINAL_STRIPPED="/tmp/R76S-Custom-v2.2.6.verify.img.gz"
          cp -f "$FINAL_IMAGE" "$FINAL_STRIPPED"
          "$FWTOOL" -i "$FINAL_META" -t "$FINAL_STRIPPED"
          grep -qF 'friendlyarm,nanopi-r76s' "$FINAL_META"
          grep -qF 'V2.2.6' "$FINAL_META"
          gzip -t "$FINAL_STRIPPED"

          for ota_file in version.latest version.index sha256sums ota.footer.html; do
            test -s "$RELEASE_DIR/$ota_file"
          done

          grep -qF '24.10.8-V2.2.6' "$RELEASE_DIR/version.latest"
          grep -qxF '24.10.8-V2.2.6' "$RELEASE_DIR/version.index"

          echo
          echo "Final image:"
          ls -lh "$FINAL_IMAGE"

          echo
          echo "===== Verify final bootloader directly ====="

          FINAL_BOOT_MD5=$(
            gzip -dc "$FINAL_STRIPPED" \
              | dd \
                  bs=512 \
                  skip=64 \
                  count=32704 \
                  status=none \
              | md5sum \
              | awk '{print $1}'
          )

          echo "Final bootloader MD5: $FINAL_BOOT_MD5"
          echo "Expected bootloader MD5: $BOOT_MD5"

          if [ "$FINAL_BOOT_MD5" != "$BOOT_MD5" ]; then
            echo "ERROR: Final image bootloader mismatch."
            exit 1
          fi

          echo
          echo "R76S v2.2.6 OTA / PassWall2 / PassWall verified successfully."

      - name: Upload final v2.2.6 firmware
        uses: actions/upload-artifact@v4
        with:
          name: R76S-Custom-v2.2.6-OTA
          path: openwrt/bin/targets/rockchip/armv8/release-v2.2.6/*
          if-no-files-found: error

      - name: Publish OTA assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r76s-v2.2.6-${{ github.run_number }}
          name: R76S Custom v2.2.6 build ${{ github.run_number }}
          make_latest: true
          generate_release_notes: false
          body: |
            R76S Custom v2.2.6
            RK3576 / TF-first / eMMC-fallback
            OTA + PassWall + PassWall2 + SmartDNS + AdGuard Home
            Clean flash defaults to DHCP + dnsmasq; online upgrade preserves existing configuration.
          files: |
            openwrt/bin/targets/rockchip/armv8/release-v2.2.6/R76S-Custom-v2.2.6-TF-squashfs.img.gz
            openwrt/bin/targets/rockchip/armv8/release-v2.2.6/version.latest
            openwrt/bin/targets/rockchip/armv8/release-v2.2.6/version.index
            openwrt/bin/targets/rockchip/armv8/release-v2.2.6/sha256sums
            openwrt/bin/targets/rockchip/armv8/release-v2.2.6/ota.footer.html
            openwrt/bin/targets/rockchip/armv8/release-v2.2.6/BOOTLOADER_INFO.txt

      - name: Build finished
        run: |
          echo "===================================="
          echo " R76S Custom v2.2.6 BUILD COMPLETE "
          echo " RK3576 / rockchip / armv8 "
          echo " OTA Preserve-Config / Clean DHCP+DNS / Status Fix / Bootloader Fix "
          echo "===================================="
