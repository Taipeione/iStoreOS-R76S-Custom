# R76S V1.2 cloud-only build. GitHub Actions compiles; Mac mini only edits source.
name: R76S Build V1.2
run-name: "R76S V1.2 #${{ github.run_number }}"

on:
  push:
    branches: [feature/r76s-v1.2]
    paths:
      - '.github/workflows/r76s-v1.2-cloud.yml'
      - 'build/local-arm64/**'
      - 'config/**'
      - 'feeds/**'
      - 'files/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r76s-v12-cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Taipeione/iStoreOS-R76S-Custom'
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    env:
      R76S_PUBLIC_RELEASE: "1"
      R76S_CLEAN_FLASH_PASSWORD_HASH: ""
      R76S_JOBS: "4"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout V1.2 source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate source before cloud build
        run: |
          set -euo pipefail
          python3 build/local-arm64/preflight.py --repo .
          python3 -m unittest discover -s build/local-arm64/tests -q
          python3 build/local-arm64/public-release/install.py --repo . --check
          test "${R76S_PUBLIC_RELEASE}" = '1'
          test -z "${R76S_CLEAN_FLASH_PASSWORD_HASH}"
          echo 'V12_CLOUD_PREFLIGHT=PASS'

      - name: Free space on disposable GitHub runner
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get clean
          df -h /
          test "$(df -Pk / | awk 'END {print $4}')" -gt 20971520

      - name: Install x86_64 cross-compile dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison gawk gettext gcc-multilib \
            git libelf-dev libncurses-dev libssl-dev python3 \
            python3-dev python3-pyelftools python3-setuptools \
            rsync swig time unzip squashfs-tools util-linux \
            zlib1g-dev file wget curl xsltproc zstd pigz \
            ca-certificates ccache patch pkg-config xz-utils \
            bzip2 openssl fdisk jq
          python3 -c 'from elftools.elf.elffile import ELFFile; print("ELFTOOLS=PASS")'

      - name: Restore ccache from prior GitHub builds
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: r76s-v12-x64-ccache-${{ hashFiles('config/R76S.config') }}-${{ github.sha }}
          restore-keys: |
            r76s-v12-x64-ccache-${{ hashFiles('config/R76S.config') }}-
            r76s-v12-x64-ccache-

      - name: Prepare clean GitHub build workspace and pin iStoreOS source
        run: |
          set -euo pipefail
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /home/builder
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /home/builder/work
          test ! -e /r76s-repo
          sudo ln -s "$GITHUB_WORKSPACE" /r76s-repo
          mkdir -p "$HOME/.ccache" /home/builder/.cache
          ln -s "$HOME/.ccache" /home/builder/.ccache
          ccache -M 3G || true
          cd /home/builder/work
          git init -q openwrt
          git -C openwrt remote add origin https://github.com/istoreos/istoreos.git
          git -C openwrt -c http.version=HTTP/1.1 fetch --depth=1 origin fb971407ffd9a094e6f16d9c029f1f580ed5c2ad
          git -C openwrt checkout -q --detach FETCH_HEAD
          test "$(git -C openwrt rev-parse HEAD)" = fb971407ffd9a094e6f16d9c029f1f580ed5c2ad
          echo 'ISTOREOS_PINNED_SOURCE=PASS'

      - name: Build V1.2 using all existing 27 guarded stages
        run: |
          set -euo pipefail
          test "${R76S_PUBLIC_RELEASE}" = 1
          test -z "${R76S_CLEAN_FLASH_PASSWORD_HASH}"
          bash build/local-arm64/candidate-inside.sh
          echo 'PUBLIC_TEST_BUILD_COMPLETE=YES; NOT_PUBLISHED'

      - name: Verify V1.2 artifacts and SHA256
        run: |
          set -euo pipefail
          cd /home/builder/work/openwrt/bin/targets/rockchip/armv8/release-v1.2
          test -s R76S-V1.2-TF-squashfs.img.gz
          test -s CANDIDATE-NOT-FOR-RELEASE.txt
          test -s version.latest
          test -s version.index
          grep -qxF '24.10.8-V1.2' version.index
          grep -qF '[24.10.8-V1.2](R76S-V1.2-TF-squashfs.img.gz)' version.latest
          sha256sum -c sha256sums
          echo 'GITHUB_V12_IMAGE_STATIC_AUDIT=PASS'
          echo 'GITHUB_V12_RELEASE_STATUS=UNVALIDATED_ARTIFACT_ONLY'

      - name: Trim ccache before saving GitHub cache
        if: always()
        run: |
          ccache -M 3G || true
          ccache -c || true
          ccache -s || true

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R76S-V1.2-cloud-diagnostics-${{ github.run_number }}
          path: |
            /home/builder/work/logs/
            /home/builder/work/r76s-build-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload V1.2 TEST firmware (NOT FOR RELEASE)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: R76S-V1.2-TEST-NOT-FOR-RELEASE-${{ github.run_number }}
          path: /home/builder/work/openwrt/bin/targets/rockchip/armv8/release-v1.2/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
