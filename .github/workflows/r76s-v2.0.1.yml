name: R76S-V2.0.1
run-name: "R76S-V2.0.1 #${{ github.run_number }}"

on:
  push:
    branches:
      - main
      - codex/r76s-v2.0.1-openwrt-25.12
  workflow_dispatch:
    inputs:
      tf_boot_test:
        description: 'Build the isolated R76S-V2.0.1 TF boot-test artifact'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: r76s-v2.0.1-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENWRT_COMMIT: 64900e756efa667774214f9c6b17c113222e01f7
  OPENWRT_VERSION: 25.12.6
  TARGET: rockchip/armv8
  DEVICE: friendlyarm_nanopi-r76s
  VERSION: R76S-V2.0.1
  R76S_JOBS: 2
  DEBIAN_FRONTEND: noninteractive

jobs:
  source-validation:
    name: Source Validation
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact repository commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install validation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk gettext git libncurses-dev \
            libssl-dev libelf-dev python3 python3-distutils rsync unzip \
            wget xsltproc zlib1g-dev file ccache lua5.1 lua-filesystem

      - name: Prepare validation report and verify hosted runner
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/source-validation"
          {
            echo "# R76S-V2.0.1 cloud source validation"
            echo
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Commit: $GITHUB_SHA"
            echo "- Runner: $(uname -a)"
            echo "- Architecture: $(uname -m)"
            echo "- Formal platform: GitHub-hosted Ubuntu x86_64"
            echo "- OpenWrt: $OPENWRT_VERSION ($OPENWRT_COMMIT)"
            echo "- Target: $TARGET"
            echo "- Device: $DEVICE"
            echo "- Hardware boot test: NOT TESTED"
          } > "$RUNNER_TEMP/source-validation/source-validation.md"
          test "$(uname -m)" = x86_64
          df -h "$GITHUB_WORKSPACE" | tee -a "$RUNNER_TEMP/source-validation/source-validation.md"

      - name: Validate repository gates and locked source metadata
        run: |
          set -Eeuo pipefail
          python3 build/v2/preflight.py --repo . | tee -a "$RUNNER_TEMP/source-validation/source-validation.md"
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('config/r76s-v2-sources.lock.json').read_text())
          assert lock['openwrt']['commit'] == '64900e756efa667774214f9c6b17c113222e01f7'
          assert lock['openwrt']['target'] == 'rockchip/armv8'
          assert lock['openwrt']['device'] == 'friendlyarm_nanopi-r76s'
          assert lock['openwrt']['release_kernel'] == '6.12.112'
          assert lock['cargo_network'] == {
              'http_multiplexing': False,
              'net_retry': 10,
              'http_timeout_seconds': 120,
              'reason': lock['cargo_network']['reason'],
          }
          print('LOCKED_METADATA=PASS')
          PY

      - name: Fetch and verify official OpenWrt 25.12.6
        run: |
          set -Eeuo pipefail
          export OPENWRT_DIR="$RUNNER_TEMP/openwrt"
          git clone --filter=blob:none https://github.com/openwrt/openwrt.git "$OPENWRT_DIR"
          git -C "$OPENWRT_DIR" fetch --depth 1 origin "$OPENWRT_COMMIT"
          git -C "$OPENWRT_DIR" checkout --detach "$OPENWRT_COMMIT"
          test "$(git -C "$OPENWRT_DIR" rev-parse HEAD)" = "$OPENWRT_COMMIT"
          grep -q 'define Device/friendlyarm_nanopi-r76s' "$OPENWRT_DIR/target/linux/rockchip/image/armv8.mk"
          grep -q '$(Device/rk3576)' "$OPENWRT_DIR/target/linux/rockchip/image/armv8.mk"
          grep -q 'UBOOT_DEVICE_NAME := generic-rk3576' "$OPENWRT_DIR/target/linux/rockchip/image/armv8.mk"
          grep -q 'TARGET_DEVICES += friendlyarm_nanopi-r76s' "$OPENWRT_DIR/target/linux/rockchip/image/armv8.mk"
          test -f "$OPENWRT_DIR/target/linux/rockchip/patches-6.12/136-arm64-dts-rockchip-Update-LED-properties-for-NanoPi-R76S.patch"
          python3 scripts/r76s-v2.0.1-ota-audit.py \
            --repo "$GITHUB_WORKSPACE" --openwrt "$OPENWRT_DIR" \
            --output "$RUNNER_TEMP/source-validation/ota-compatibility-audit.md"
          {
            echo
            echo '## OpenWrt/RK3576 source checks'
            echo '- OpenWrt commit: PASS'
            echo '- rockchip/armv8: PASS'
            echo '- friendlyarm_nanopi-r76s profile: PASS'
            echo '- RK3576 U-Boot device: PASS'
            echo '- NanoPi R76S DTS patch: PASS'
            echo '- V1.4.6 direct OTA: BLOCKED by explicit compatibility gate'
            echo '- V2.0.0 same-layout OTA: PASS by static gate'
          } >> "$RUNNER_TEMP/source-validation/source-validation.md"
          test -s "$GITHUB_WORKSPACE/docs/R76S-V2.0.1-OTA-GUIDE.md"
          test -s "$GITHUB_WORKSPACE/docs/R76S-V2.0.1-OTA-COMPATIBILITY.md"
          test -s "$GITHUB_WORKSPACE/docs/R76S-V2.0.1-RECOVERY-GUIDE.md"
          test -s "$GITHUB_WORKSPACE/docs/R76S-V2.0.1-LOGIN-SECURITY.md"
          test -s "$GITHUB_WORKSPACE/docs/R76S-V2.0.1-TESTPLAN.md"

      - name: Verify feeds and all 11 rule inputs
        run: |
          set -Eeuo pipefail
          export OPENWRT_DIR="$RUNNER_TEMP/openwrt"
          cp config/feeds-v2.conf "$OPENWRT_DIR/feeds.conf.default"
          git -C "$OPENWRT_DIR" config --global --add safe.directory "$OPENWRT_DIR"
          "$OPENWRT_DIR/scripts/feeds" update -a
          "$OPENWRT_DIR/scripts/feeds" install -a
          sh scripts/r76s-patch-third-party-sources.sh \
            "$OPENWRT_DIR/package/feeds/passwall_packages/dns2socks/Makefile"
          python3 scripts/r76s-import-app-rules.py \
            --input-dir config/rules/apps \
            --output "$RUNNER_TEMP/source-validation/r76s-app-rules.json" \
            --report "$RUNNER_TEMP/source-validation/domain-rule-audit.md"
          PW1=$(find -L "$OPENWRT_DIR/package" -path '*/luci-app-passwall/root/usr/share/passwall/0_default_config' -type f | sort | head -1)
          PW2=$(find -L "$OPENWRT_DIR/package" -path '*/luci-app-passwall2/root/usr/share/passwall2/0_default_config' -type f | sort | head -1)
          test -n "$PW1" -a -n "$PW2"
          cp "$PW1" "$RUNNER_TEMP/source-validation/passwall-default.config"
          cp "$PW2" "$RUNNER_TEMP/source-validation/passwall2-default.config"
          python3 scripts/r76s-generate-rules.py \
            config/rules/r76s-rules.json "$PW1" "$PW2" \
            "$RUNNER_TEMP/source-validation/r76s-app-rules.json"
          python3 scripts/r76s-v2-rules-audit.py \
            config/rules/r76s-rules.json \
            "$RUNNER_TEMP/source-validation/r76s-app-rules.json" "$PW1" "$PW2"
          python3 - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path(__import__('os').environ['RUNNER_TEMP'], 'source-validation', 'r76s-app-rules.json').read_text())
          rules = {r['name']: r for r in doc['rules']}
          assert len(rules) == 11, len(rules)
          assert len(rules['AppleEcosystem']['options']['domain_list'].splitlines()) == 85
          assert not any(k in rules['AppleEcosystem']['options'] for k in ('node', 'outbound', 'strategy'))
          for name in ('AmazonPrime', 'ChatGPT', 'DisneyApp', 'Emby', 'HBO Max', 'NetflixApp', 'NintendoApp', 'TelegramApp', 'TikTokApp', 'YouTubeYouTubeTV'):
              assert name in rules and rules[name]['options']['domain_list'].strip(), name
          print('RULE_INPUTS=PASS 11/11; APPLE=PASS 85; USER_APPS=PASS 10/10')
          PY
          cat "$RUNNER_TEMP/source-validation/domain-rule-audit.md" >> "$RUNNER_TEMP/source-validation/source-validation.md"

      - name: Upload source validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R76S-V2.0.1-source-validation-${{ github.run_number }}
          path: ${{ runner.temp }}/source-validation
          if-no-files-found: warn
          retention-days: 30

  openwrt-build:
    name: OpenWrt 25.12.6 Build
    needs: source-validation
    if: needs.source-validation.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact repository commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bison flex gawk gettext git libncurses-dev \
            libssl-dev libelf-dev python3 python3-distutils rsync unzip \
            wget xsltproc zlib1g-dev file ccache time swig python3-pyelftools

      - name: Restore OpenWrt download and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/openwrt-dl
            ~/.cache/ccache
          key: r76s-v2.0.1-${{ runner.os }}-${{ hashFiles('config/R76S-V2.config', 'config/feeds-v2.conf') }}
          restore-keys: |
            r76s-v2.0.1-${{ runner.os }}-

      - name: Build official OpenWrt firmware
        run: |
          set -Eeuo pipefail
          BUILD_LOG="$RUNNER_TEMP/cloud-build.log"
          RELEASE="$RUNNER_TEMP/release/R76S-V2.0.1"
          mkdir -p "$RELEASE" "$RUNNER_TEMP/openwrt-dl"
          exec > >(tee -a "$BUILD_LOG") 2>&1
          echo "BUILD_PLATFORM=github-hosted-ubuntu-22.04-x86_64"
          echo "BUILD_COMMIT=$GITHUB_SHA"
          echo "OPENWRT_COMMIT=$OPENWRT_COMMIT"
          git clone --filter=blob:none https://github.com/openwrt/openwrt.git "$RUNNER_TEMP/openwrt"
          git -C "$RUNNER_TEMP/openwrt" fetch --depth 1 origin "$OPENWRT_COMMIT"
          git -C "$RUNNER_TEMP/openwrt" checkout --detach "$OPENWRT_COMMIT"
          cd "$RUNNER_TEMP/openwrt"
          cp "$GITHUB_WORKSPACE/config/feeds-v2.conf" feeds.conf.default
          export DL_DIR="$RUNNER_TEMP/openwrt-dl"
          export CCACHE_DIR="$HOME/.cache/ccache"
          # Run #16 hit curl [16] HTTP2 framing while Cargo fetched a locked
          # shadowsocks-rust crate. Keep the package enabled, but use a stable
          # non-multiplexed transport and bounded retries for the full build.
          export CARGO_HTTP_MULTIPLEXING=false
          export CARGO_NET_RETRY=10
          export CARGO_HTTP_TIMEOUT=120
          echo "CARGO_HTTP_MULTIPLEXING=$CARGO_HTTP_MULTIPLEXING"
          echo "CARGO_NET_RETRY=$CARGO_NET_RETRY"
          echo "CARGO_HTTP_TIMEOUT=$CARGO_HTTP_TIMEOUT"
          ccache --zero-stats || true
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          sh "$GITHUB_WORKSPACE/scripts/r76s-stage-smartdns-runtime.sh" \
            "$GITHUB_WORKSPACE/feeds/luci-app-r76s-updater" \
            "$RUNNER_TEMP/smartdns-runtime"
          mkdir -p package/r76s
          cp -a "$GITHUB_WORKSPACE/feeds/." package/r76s/
          cp -a "$GITHUB_WORKSPACE/files/." .
          sh "$GITHUB_WORKSPACE/scripts/r76s-patch-third-party-sources.sh" \
            package/feeds/passwall_packages/dns2socks/Makefile
          python3 "$GITHUB_WORKSPACE/scripts/r76s-import-app-rules.py" \
            --input-dir "$GITHUB_WORKSPACE/config/rules/apps" \
            --output "$RUNNER_TEMP/r76s-app-rules.json" \
            --report "$RUNNER_TEMP/domain-rule-audit.md"
          cp "$RUNNER_TEMP/r76s-app-rules.json" package/r76s/r76s-core/files/usr/share/r76s/r76s-app-rules.json
          PW1=$(find -L package -path '*/luci-app-passwall/root/usr/share/passwall/0_default_config' -type f | sort | head -1)
          PW2=$(find -L package -path '*/luci-app-passwall2/root/usr/share/passwall2/0_default_config' -type f | sort | head -1)
          test -n "$PW1" -a -n "$PW2"
          python3 "$GITHUB_WORKSPACE/scripts/r76s-generate-rules.py" \
            "$GITHUB_WORKSPACE/config/rules/r76s-rules.json" "$PW1" "$PW2" \
            "$RUNNER_TEMP/r76s-app-rules.json"
          python3 "$GITHUB_WORKSPACE/scripts/r76s-v2-rules-audit.py" \
            "$GITHUB_WORKSPACE/config/rules/r76s-rules.json" \
            "$RUNNER_TEMP/r76s-app-rules.json" "$PW1" "$PW2"
          cp "$GITHUB_WORKSPACE/config/R76S-V2.config" .config
          make defconfig
          echo 'BUILD_STAGE=target-kernel-and-packages-rootfs-firmware'
          make -j"$R76S_JOBS" V=s
          IMAGE_DIR="bin/targets/rockchip/armv8"
          test -d "$IMAGE_DIR"
          find "$IMAGE_DIR" -maxdepth 1 -type f \( -name '*nanopi-r76s*' -o -name '*friendlyarm*' \) -exec cp -a {} "$RELEASE/" \;
          test -n "$(find "$RELEASE" -type f -name '*.img*' -print -quit)"
          cp "$RUNNER_TEMP/domain-rule-audit.md" "$RELEASE/domain-rule-audit.md"
          cp "$RUNNER_TEMP/r76s-app-rules.json" "$RELEASE/r76s-app-rules.json"
          cp "$GITHUB_WORKSPACE/config/rules/r76s-rules.json" "$RELEASE/baseline-rules.json"
          cp "$PW1" "$RELEASE/PassWall-default.config"
          cp "$PW2" "$RELEASE/PassWall2-default.config"
          cp "$GITHUB_WORKSPACE/docs/R76S-V2.0.1-TEST-PLAN.md" "$RELEASE/TestPlan.md"
          cp "$GITHUB_WORKSPACE/docs/R76S-V2.0.1-OTA-GUIDE.md" "$RELEASE/OTA-GUIDE.md"
          cp "$GITHUB_WORKSPACE/docs/R76S-V2.0.1-OTA-COMPATIBILITY.md" "$RELEASE/OTA-COMPATIBILITY.md"
          cp "$GITHUB_WORKSPACE/docs/R76S-V2.0.1-RECOVERY-GUIDE.md" "$RELEASE/RECOVERY-GUIDE.md"
          cp "$GITHUB_WORKSPACE/docs/R76S-V2.0.1-LOGIN-SECURITY.md" "$RELEASE/LOGIN-SECURITY.md"
          cp "$GITHUB_WORKSPACE/docs/R76S-V2.0.1-TESTPLAN.md" "$RELEASE/V2.0.1-TESTPLAN.md"
          printf '%s\n' "$VERSION" > "$RELEASE/Version"
          export RELEASE BUILD_LOG
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          lock = json.loads(Path(os.environ['GITHUB_WORKSPACE'], 'config/r76s-v2-sources.lock.json').read_text())
          info = {
              'version': os.environ['VERSION'],
              'repository': os.environ['GITHUB_REPOSITORY'],
              'source_commit': os.environ['GITHUB_SHA'],
              'openwrt_commit': os.environ['OPENWRT_COMMIT'],
              'openwrt_version': os.environ['OPENWRT_VERSION'],
              'target': os.environ['TARGET'],
              'device': os.environ['DEVICE'],
              'kernel_release': lock['openwrt']['release_kernel'],
              'kmod_abi': lock['openwrt']['release_kmod_abi'],
              'builder': 'GitHub-hosted ubuntu-22.04 x86_64',
              'apk': True,
              'hardware_boot_tested': 'NOT TESTED',
              'stable_ota_published': False,
              'rule_gate': '10 user TXT groups + AppleEcosystem 85 required',
              'direct_ota_from_v1_4_6': False,
              'direct_ota_from_v2_0_0': True,
              'ota_partition_geometry': {'kernel_mib': 64, 'rootfs_mib': 512},
              'root_password_policy': 'SHA-512-crypt hash; initial password is documented separately',
              'ssh_management_scope': 'LAN interface only',
              'normal_ota_requires_uart': False,
              'hardware_recovery_uart_free_guarantee': False,
              'cargo_network': lock['cargo_network'],
          }
          Path(os.environ['RELEASE'], 'BuildInfo.json').write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n')
          PY
          cp "$BUILD_LOG" "$RELEASE/build.log"
          (cd "$RELEASE" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          ccache --show-stats || true

      - name: Upload cloud build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R76S-V2.0.1-cloud-build-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/release/R76S-V2.0.1
            ${{ runner.temp }}/cloud-build.log
          if-no-files-found: warn
          retention-days: 30

  tf-boot-test-artifact:
    name: TF Boot Test Artifact
    needs: openwrt-build
    if: needs.openwrt-build.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.tf_boot_test == true
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source and TF audit tools
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install TF image inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3 squashfs-tools file

      - name: Fetch locked OpenWrt source for image provenance audit
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none https://github.com/openwrt/openwrt.git "$RUNNER_TEMP/openwrt"
          git -C "$RUNNER_TEMP/openwrt" fetch --depth 1 origin "$OPENWRT_COMMIT"
          git -C "$RUNNER_TEMP/openwrt" checkout --detach "$OPENWRT_COMMIT"
          test "$(git -C "$RUNNER_TEMP/openwrt" rev-parse HEAD)" = "$OPENWRT_COMMIT"

      - name: Download cloud-built firmware and create TF-only artifact
        uses: actions/download-artifact@v4
        with:
          name: R76S-V2.0.1-cloud-build-${{ github.run_number }}
          path: ${{ runner.temp }}/cloud-build

      - name: Audit boot chain and package isolated TF artifact
        run: |
          set -Eeuo pipefail
          RELEASE=$(find "$RUNNER_TEMP/cloud-build" -name BuildInfo.json -printf '%h\n' | head -1)
          IMAGE=$(find "$RELEASE" -maxdepth 1 -type f -name '*friendlyarm_nanopi-r76s*.img.gz' -print -quit)
          test -n "$RELEASE" -a -s "$IMAGE"
          TF_OUT="$RUNNER_TEMP/tf-boot-test"
          mkdir -p "$TF_OUT"
          python3 scripts/r76s-tf-boot-audit.py \
            --image "$IMAGE" \
            --source-root "$RUNNER_TEMP/openwrt" \
            --output-dir "$TF_OUT"
          cp docs/R76S-V2.0.1-TF-BOOT-TESTPLAN.md "$TF_OUT/TF-BOOT-TESTPLAN.md"
          export RELEASE IMAGE TF_OUT
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          def sha(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()

          release = Path(os.environ['RELEASE'])
          image = Path(os.environ['IMAGE'])
          out = Path(os.environ['TF_OUT'])
          info = json.loads((release / 'BuildInfo.json').read_text())
          tf_image = out / 'openwrt-rockchip-armv8-friendlyarm_nanopi-r76s-squashfs-tf-boot-test.img.gz'
          info.update({
              'artifact_kind': 'R76S-V2.0.1-TF-BOOT-TEST',
              'source_image': image.name,
              'source_image_sha256': sha(image),
              'tf_image': tf_image.name,
              'tf_image_sha256': sha(tf_image),
              'hardware_boot_tested': 'NOT TESTED',
              'emmc_write_performed': False,
              'spi_write_performed': False,
              'eflasher_included': False,
          })
          (out / 'BuildInfo.json').write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n')
          PY
          (cd "$TF_OUT" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$TF_OUT" && sha256sum -c SHA256SUMS)

      - name: Upload isolated TF boot-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: R76S-V2.0.1-TF-BOOT-TEST
          path: ${{ runner.temp }}/tf-boot-test
          if-no-files-found: error
          retention-days: 90

  firmware-audit:
    name: Firmware Audit
    needs: openwrt-build
    if: needs.openwrt-build.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout audit scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download cloud build artifact
        uses: actions/download-artifact@v4
        with:
          name: R76S-V2.0.1-cloud-build-${{ github.run_number }}
          path: ${{ runner.temp }}/cloud-build

      - name: Run automated release gate audit
        run: |
          set -Eeuo pipefail
          RELEASE=$(find "$RUNNER_TEMP/cloud-build" -name BuildInfo.json -printf '%h\n' | head -1)
          test -n "$RELEASE"
          test -s "$RELEASE/BuildInfo.json"
          test -s "$RELEASE/TestPlan.md"
          test -s "$RELEASE/Version"
          test -s "$RELEASE/SHA256SUMS"
          (cd "$RELEASE" && sha256sum -c SHA256SUMS)
          python3 - "$RELEASE" <<'PY'
          import json, sys
          from pathlib import Path
          release = Path(sys.argv[1])
          images = sorted(release.glob('*.img*'))
          eligible = [p for p in images if 1024 * 1024 < p.stat().st_size < 1024 * 1024 * 1024]
          if not eligible:
              raise SystemExit(f"RELEASE_GATE=FAIL no firmware image in 1MiB..1GiB; candidates={[(p.name, p.stat().st_size) for p in images]}")
          if not any(('nanopi-r76s' in p.name or 'friendlyarm' in p.name) for p in eligible):
              raise SystemExit(f"RELEASE_GATE=FAIL image filename does not identify NanoPi R76S; candidates={[p.name for p in eligible]}")
          info = json.loads((release / 'BuildInfo.json').read_text())
          checks = {
              'version': info.get('version') == 'R76S-V2.0.1',
              'target': info.get('target') == 'rockchip/armv8',
              'device': info.get('device') == 'friendlyarm_nanopi-r76s',
              'openwrt_version': info.get('openwrt_version') == '25.12.6',
              'apk': info.get('apk') is True,
              'hardware_boot_tested': info.get('hardware_boot_tested') == 'NOT TESTED',
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              values = {name: info.get(name) for name in checks}
              raise SystemExit(f"RELEASE_GATE=FAIL BuildInfo fields={failed}; values={values}")
          manifest = json.loads((release / 'r76s-app-rules.json').read_text())
          rules = {r['name']: r for r in manifest['rules']}
          if len(rules) != 11:
              raise SystemExit(f"RELEASE_GATE=FAIL rule_count={len(rules)} expected=11")
          if 'AppleEcosystem' not in rules or len(rules['AppleEcosystem']['options']['domain_list'].splitlines()) != 85:
              raise SystemExit('RELEASE_GATE=FAIL AppleEcosystem domain count is not 85')
          if any(k in rules['AppleEcosystem']['options'] for k in ('node', 'outbound', 'strategy')):
              raise SystemExit('RELEASE_GATE=FAIL AppleEcosystem has a forced outbound option')
          for name in ('AmazonPrime', 'ChatGPT', 'DisneyApp', 'Emby', 'HBO Max', 'NetflixApp', 'NintendoApp', 'TelegramApp', 'TikTokApp', 'YouTubeYouTubeTV'):
              if name not in rules or not rules[name]['options']['domain_list'].strip():
                  raise SystemExit(f'RELEASE_GATE=FAIL missing application rule {name}')
          print(f'RELEASE_GATE=PASS target=RK3576 device=NanoPi-R76S apple=85 user_apps=10 image={eligible[0].name} bytes={eligible[0].stat().st_size}')
          PY
          python3 scripts/r76s-v2-rules-audit.py \
            "$RELEASE/baseline-rules.json" "$RELEASE/r76s-app-rules.json" \
            "$RELEASE/PassWall-default.config" "$RELEASE/PassWall2-default.config" \
            | tee "$RUNNER_TEMP/rules-audit.txt"
          {
            echo '# R76S-V2.0.1 firmware audit'
            echo
            echo '- Cloud build exit: PASS'
            echo '- Target/device/image filename: PASS'
            echo '- SHA256SUMS: PASS'
            echo '- BuildInfo/Version/TestPlan: PASS'
            echo '- AppleEcosystem: PASS, 85 domains, default outbound policy'
            echo '- User application groups: PASS, 10/10'
            echo '- PassWall/PassWall2: PASS'
            echo '- WeChatDirect TCP/UDP direct and broad qq.com guard: PASS'
            echo '- HARDWARE BOOT TESTED: NOT TESTED'
            echo '- Direct V1.4.6 OTA: BLOCKED; V2.0.0 OTA: STATIC PASS'
            echo
            cat "$RUNNER_TEMP/rules-audit.txt"
          } > "$RUNNER_TEMP/firmware-audit.md"

      - name: Upload firmware audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R76S-V2.0.1-firmware-audit-${{ github.run_number }}
          path: ${{ runner.temp }}/firmware-audit.md
          if-no-files-found: warn
          retention-days: 30

  rule-audit:
    name: Rule Audit
    needs: openwrt-build
    if: needs.openwrt-build.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout rule audit scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download cloud build artifact
        uses: actions/download-artifact@v4
        with:
          name: R76S-V2.0.1-cloud-build-${{ github.run_number }}
          path: ${{ runner.temp }}/cloud-build

      - name: Audit Apple, ten user groups, PassWall and WeChatDirect
        run: |
          set -Eeuo pipefail
          RELEASE=$(find "$RUNNER_TEMP/cloud-build" -name BuildInfo.json -printf '%h\n' | head -1)
          test -n "$RELEASE"
          python3 - "$RELEASE" <<'PY'
          import json, sys
          from pathlib import Path
          release = Path(sys.argv[1])
          manifest = json.loads((release / 'r76s-app-rules.json').read_text())
          rules = {r['name']: r for r in manifest['rules']}
          assert len(rules) == 11
          assert len(rules['AppleEcosystem']['options']['domain_list'].splitlines()) == 85
          assert not any(k in rules['AppleEcosystem']['options'] for k in ('node', 'outbound', 'strategy'))
          for name in ('AmazonPrime', 'ChatGPT', 'DisneyApp', 'Emby', 'HBO Max', 'NetflixApp', 'NintendoApp', 'TelegramApp', 'TikTokApp', 'YouTubeYouTubeTV'):
              assert name in rules and rules[name]['options']['domain_list'].strip(), name
          PY
          python3 scripts/r76s-v2-rules-audit.py \
            "$RELEASE/baseline-rules.json" "$RELEASE/r76s-app-rules.json" \
            "$RELEASE/PassWall-default.config" "$RELEASE/PassWall2-default.config" \
            > "$RUNNER_TEMP/rule-audit.md"
          {
            echo '# R76S-V2.0.1 rule audit'
            echo
            echo '- AppleEcosystem: PASS, 85 domains, no forced outbound strategy'
            echo '- User application groups: PASS, 10/10 complete'
            echo '- PassWall: PASS'
            echo '- PassWall2: PASS'
            echo '- WeChatDirect TCP/UDP and _direct: PASS'
            echo '- Broad domain:qq.com in WeChatDirect: ABSENT'
            echo
            cat "$RUNNER_TEMP/rule-audit.md"
          } > "$RUNNER_TEMP/rule-audit.final.md"
          mv "$RUNNER_TEMP/rule-audit.final.md" "$RUNNER_TEMP/rule-audit.md"

      - name: Upload rule audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R76S-V2.0.1-rule-audit-${{ github.run_number }}
          path: ${{ runner.temp }}/rule-audit.md
          if-no-files-found: warn
          retention-days: 30

  ota-compatibility-audit:
    name: OTA Compatibility Audit
    needs: openwrt-build
    if: needs.openwrt-build.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout OTA audit sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch locked OpenWrt source and audit migration gates
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none https://github.com/openwrt/openwrt.git "$RUNNER_TEMP/openwrt"
          git -C "$RUNNER_TEMP/openwrt" fetch --depth 1 origin "$OPENWRT_COMMIT"
          git -C "$RUNNER_TEMP/openwrt" checkout --detach "$OPENWRT_COMMIT"
          python3 scripts/r76s-v2.0.1-ota-audit.py \
            --repo "$GITHUB_WORKSPACE" --openwrt "$RUNNER_TEMP/openwrt" \
            --output "$RUNNER_TEMP/OTA-COMPATIBILITY-AUDIT.md"
          cp docs/R76S-V2.0.1-OTA-COMPATIBILITY.md "$RUNNER_TEMP/V2.0.1-OTA-COMPATIBILITY.md"
          cat "$RUNNER_TEMP/V2.0.1-OTA-COMPATIBILITY.md" >> "$RUNNER_TEMP/OTA-COMPATIBILITY-AUDIT.md"

      - name: Upload OTA compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: R76S-V2.0.1-ota-compatibility-${{ github.run_number }}
          path: ${{ runner.temp }}/*OTA-COMPATIBILITY*.md
          if-no-files-found: error
          retention-days: 90

  login-security-audit:
    name: Login Security Audit
    needs: openwrt-build
    if: needs.openwrt-build.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout login policy
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Audit hashed root credential and LAN-only SSH
        run: |
          set -Eeuo pipefail
          HASHED=files/etc/uci-defaults/95-r76s-initial-root-password
          AUTH=files/etc/uci-defaults/99-r76s-root-auth
          grep -q '\$6\$' "$HASHED"
          ! grep -qE 'passwd[[:space:]]+root|password$' "$HASHED"
          grep -q "Interface='lan'" "$AUTH"
          ! rg -n 'R76S_INITIAL_ROOT_PASSWORD|password=password|root:password' . --glob '!work/**' --glob '!outputs/**'
          {
            echo '# R76S-V2.0.1 Login Security Audit'
            echo
            echo '- Root credential storage: PASS, SHA-512-crypt shadow hash'
            echo '- Plaintext password in source/log metadata: ABSENT'
            echo '- Dropbear management scope: PASS, LAN interface only'
            echo '- First-login password-change warning: PASS'
          } > "$RUNNER_TEMP/login-security-audit.md"

      - name: Upload login security evidence
        uses: actions/upload-artifact@v4
        with:
          name: R76S-V2.0.1-login-security-${{ github.run_number }}
          path: ${{ runner.temp }}/login-security-audit.md
          if-no-files-found: error
          retention-days: 90

  recovery-plan-audit:
    name: Recovery Plan Audit
    needs: openwrt-build
    if: needs.openwrt-build.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout recovery documentation
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify recovery boundaries
        run: |
          set -Eeuo pipefail
          grep -q 'HARDWARE BOOT TESTED: NOT TESTED' docs/R76S-V2.0.1-TESTPLAN.md
          grep -q '不能保证无需 UART' docs/R76S-V2.0.1-RECOVERY-GUIDE.md
          grep -q 'MASKROM' docs/R76S-V2.0.1-RECOVERY-GUIDE.md
          grep -q '不自动刷写生产设备' docs/R76S-V2.0.1-RECOVERY-GUIDE.md
          ! rg -n '保证所有.*无需 UART|所有.*无需 UART.*保证|自动执行.*(MASKROM|EraseAll)' docs/R76S-V2.0.1-RECOVERY-GUIDE.md
          cp docs/R76S-V2.0.1-RECOVERY-GUIDE.md "$RUNNER_TEMP/recovery-guide.md"
          cp docs/R76S-V2.0.1-RECOVERY-GUIDE.md "$RUNNER_TEMP/recovery-audit.md"

      - name: Upload recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: R76S-V2.0.1-recovery-${{ github.run_number }}
          path: ${{ runner.temp }}/recovery-*.md
          if-no-files-found: error
          retention-days: 90

  codex-release-review:
    name: Codex Release Review
    needs:
      - openwrt-build
      - firmware-audit
      - rule-audit
      - ota-compatibility-audit
      - login-security-audit
      - recovery-plan-audit
    if: needs.openwrt-build.result == 'success' && needs.firmware-audit.result == 'success' && needs.rule-audit.result == 'success' && needs.ota-compatibility-audit.result == 'success' && needs.login-security-audit.result == 'success' && needs.recovery-plan-audit.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Download build and all audit evidence
        uses: actions/download-artifact@v4
        with:
          pattern: R76S-V2.0.1-*-${{ github.run_number }}
          merge-multiple: true
          path: ${{ runner.temp }}/final-artifacts

      - name: Run final Codex release review and prepare verified artifact
        run: |
          set -Eeuo pipefail
          RELEASE=$(find "$RUNNER_TEMP/final-artifacts" -name BuildInfo.json -printf '%h\n' | head -1)
          FIRMWARE_AUDIT=$(find "$RUNNER_TEMP/final-artifacts" -name firmware-audit.md -print -quit)
          RULE_AUDIT=$(find "$RUNNER_TEMP/final-artifacts" -name rule-audit.md -print -quit)
          test -n "$RELEASE" -a -n "$FIRMWARE_AUDIT" -a -n "$RULE_AUDIT"
          cp "$FIRMWARE_AUDIT" "$RELEASE/firmware-audit.md"
          cp "$RULE_AUDIT" "$RELEASE/rule-audit.md"
          (cd "$RELEASE" && sha256sum -c SHA256SUMS)
          test -s "$RELEASE/BuildInfo.json" -a -s "$RELEASE/TestPlan.md" -a -s "$RELEASE/Version"
          test -s "$RELEASE/OTA-GUIDE.md" -a -s "$RELEASE/OTA-COMPATIBILITY.md"
          test -s "$RELEASE/RECOVERY-GUIDE.md" -a -s "$RELEASE/LOGIN-SECURITY.md"
          OTA_AUDIT=$(find "$RUNNER_TEMP/final-artifacts" -name OTA-COMPATIBILITY-AUDIT.md -print -quit)
          LOGIN_AUDIT=$(find "$RUNNER_TEMP/final-artifacts" -name login-security-audit.md -print -quit)
          RECOVERY_AUDIT=$(find "$RUNNER_TEMP/final-artifacts" -name recovery-audit.md -print -quit)
          test -n "$OTA_AUDIT"
          test -n "$LOGIN_AUDIT" -a -n "$RECOVERY_AUDIT"
          grep -q 'OTA_COMPATIBILITY_AUDIT=PASS' "$OTA_AUDIT"
          grep -q 'Root credential storage: PASS' "$LOGIN_AUDIT"
          grep -q '不能保证无需 UART' "$RECOVERY_AUDIT"
          grep -q 'HARDWARE BOOT TESTED: NOT TESTED' "$RELEASE/firmware-audit.md"
          grep -q 'AppleEcosystem: PASS' "$RELEASE/rule-audit.md"
          grep -q 'User application groups: PASS, 10/10 complete' "$RELEASE/rule-audit.md"
          cat > "$RELEASE/ReleaseReport.md" <<EOF
          # $VERSION cloud release report

          - Cloud build run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          - Source commit: $GITHUB_SHA
          - Target: $TARGET / $DEVICE / RK3576
          - OpenWrt: $OPENWRT_VERSION ($OPENWRT_COMMIT)
          - AppleEcosystem: 85 domains, system-default outbound policy
          - User application groups: 10/10 imported
          - PassWall/PassWall2 and WeChatDirect: audited successfully
          - SHA256: verified by Codex Release Review
          - HARDWARE BOOT TESTED: NOT TESTED
          - V1.4.6 direct OTA: BLOCKED; V2.0.0 same-layout OTA: SUPPORTED BY STATIC GATES
          - Signed OTA metadata: generated and attached to this release
          EOF
          (cd "$RELEASE" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$RELEASE" && sha256sum -c SHA256SUMS)

      - name: Upload final firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: R76S-V2.0.1-final-${{ github.run_number }}
          path: ${{ runner.temp }}/final-artifacts
          if-no-files-found: error
          retention-days: 90

  github-release:
    name: GitHub Release
    needs: codex-release-review
    if: needs.codex-release-review.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Download final verified artifact
        uses: actions/download-artifact@v4
        with:
          name: R76S-V2.0.1-final-${{ github.run_number }}
          path: ${{ runner.temp }}/release

      - name: Recheck release gates and publish Git tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          R76S_OTA_SIGNING_KEY: ${{ secrets.R76S_OTA_SIGNING_KEY }}
        run: |
          set -Eeuo pipefail
          RELEASE=$(find "$RUNNER_TEMP/release" -name BuildInfo.json -printf '%h\n' | head -1)
          test -n "$RELEASE"
          (cd "$RELEASE" && sha256sum -c SHA256SUMS)
          grep -q 'HARDWARE BOOT TESTED: NOT TESTED' "$RELEASE/firmware-audit.md"
          grep -q 'AppleEcosystem: PASS' "$RELEASE/rule-audit.md"
          grep -q 'User application groups: 10/10 imported' "$RELEASE/ReleaseReport.md"
          test -n "$R76S_OTA_SIGNING_KEY"
          IMAGE=$(find "$RELEASE" -maxdepth 1 -type f -name 'openwrt-rockchip-armv8-friendlyarm_nanopi-r76s-squashfs-sysupgrade.img.gz' -print -quit)
          test -s "$IMAGE"
          IMAGE_NAME=$(basename "$IMAGE")
          IMAGE_SHA=$(sha256sum "$IMAGE" | awk '{print $1}')
          IMAGE_SIZE=$(stat -c '%s' "$IMAGE")
          export RELEASE IMAGE_NAME IMAGE_SHA IMAGE_SIZE VERSION OPENWRT_VERSION TARGET DEVICE GITHUB_REPOSITORY
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          release = Path(os.environ['RELEASE'])
          manifest = {
              'schema_version': 1,
              'version': os.environ['VERSION'],
              'release_tag': os.environ['VERSION'],
              'image': os.environ['IMAGE_NAME'],
              'url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['VERSION']}/{os.environ['IMAGE_NAME']}",
              'sha256': os.environ['IMAGE_SHA'],
              'size': int(os.environ['IMAGE_SIZE']),
              'target': os.environ['TARGET'],
              'device': os.environ['DEVICE'],
              'openwrt_version': os.environ['OPENWRT_VERSION'],
              'supported_devices': ['friendlyarm,nanopi-r76s'],
              'direct_ota_from_v1_4_6': False,
              'direct_ota_from_v2_0_0': True,
              'hardware_boot_tested': 'NOT TESTED',
          }
          (release / 'ota.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')
          PY
          umask 077
          printf '%s' "$R76S_OTA_SIGNING_KEY" > "$RUNNER_TEMP/r76s-ota-signing.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/r76s-ota-signing.pem" -rawin \
            -in "$RELEASE/ota.json" -out "$RELEASE/ota.json.sig"
          (cd "$RELEASE" && find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          (cd "$RELEASE" && sha256sum -c SHA256SUMS)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$VERSION" -f "sha=$GITHUB_SHA"
          assets=(
            "$RELEASE"/*.img.gz
            "$RELEASE/SHA256SUMS"
            "$RELEASE/BuildInfo.json"
            "$RELEASE/TestPlan.md"
            "$RELEASE/V2.0.1-TESTPLAN.md"
            "$RELEASE/OTA-GUIDE.md"
            "$RELEASE/OTA-COMPATIBILITY.md"
            "$RELEASE/RECOVERY-GUIDE.md"
            "$RELEASE/LOGIN-SECURITY.md"
            "$RELEASE/login-security-audit.md"
            "$RELEASE/recovery-audit.md"
            "$RELEASE/OTA-COMPATIBILITY-AUDIT.md"
            "$RELEASE/ota.json"
            "$RELEASE/ota.json.sig"
            "$RELEASE/ReleaseReport.md"
            "$RELEASE/firmware-audit.md"
            "$RELEASE/rule-audit.md"
            "$RELEASE/domain-rule-audit.md"
          )
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$VERSION" \
            --notes-file "$RELEASE/ReleaseReport.md" "${assets[@]}"
          RELEASE_URL=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "Release URL: $RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Firmware downloads are attached to: $RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
