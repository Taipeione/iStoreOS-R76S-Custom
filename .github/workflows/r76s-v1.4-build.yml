# R76S V1.4.2 cloud build. GitHub Actions compiles; source changes stay reviewable.
name: R76S Build V1.4.2
run-name: "R76S-V1.4.2 #${{ github.run_number }}"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: r76s-v14-cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Taipeione/iStoreOS-R76S-Custom' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/r76s-v1.4.2')
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    env:
      R76S_PUBLIC_RELEASE: "1"
      R76S_CLEAN_FLASH_PASSWORD_HASH: ""
      R76S_JOBS: "4"
      R76S_CCACHE_SIZE: "1G"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout V1.4.2 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # Integration tests compare OTA UI and rules against baseline 1daed16.
          fetch-depth: 0
          persist-credentials: false

      - name: Install test runtimes
        run: |
          timeout 180s sudo apt-get update -qq || echo 'APT_UPDATE_TIMEOUT_OR_PARTIAL=CONTINUE'
          sudo apt-get install -y lua5.1 lua-filesystem python3-yaml

      - name: Validate source before cloud build
        run: |
          set -euo pipefail
          python3 build/local-arm64/preflight.py --repo .
          python3 -m unittest discover -s build/local-arm64/tests -q
          python3 build/local-arm64/public-release/install.py --repo . --check
          test "${R76S_PUBLIC_RELEASE}" = '1'
          test -z "${R76S_CLEAN_FLASH_PASSWORD_HASH}"
          echo 'V12_CLOUD_PREFLIGHT=PASS'

      - name: Prepare GitHub runner disk space
        run: |
          set -euo pipefail
          # The source-controlled cleanup is bounded and avoids package-database locks.
          sudo --preserve-env=GITHUB_ACTIONS python3 build/local-arm64/prepare-cloud-disk.py
          df -h /
          df -Pk /
          # Prior run exhausted ~18 GiB before finishing package compilation.
          test "$(df -Pk / | awk 'END {print $4}')" -gt 33554432

      - name: Install x86_64 cross-compile dependencies
        run: |
          set -euo pipefail
          timeout 180s sudo apt-get update -qq || echo 'APT_UPDATE_TIMEOUT_OR_PARTIAL=CONTINUE'
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison gawk gettext gcc-multilib \
            git libelf-dev libncurses-dev libssl-dev python3 \
            python3-dev python3-pyelftools python3-setuptools \
            rsync swig time unzip squashfs-tools util-linux \
            zlib1g-dev file wget curl xsltproc zstd pigz \
            ca-certificates ccache patch pkg-config xz-utils \
            bzip2 openssl fdisk jq
          python3 -c 'from elftools.elf.elffile import ELFFile; print("ELFTOOLS=PASS")'

      - name: Install pinned Go 1.26.6 host toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: false

      - name: Verify GitHub host Go
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.26.6"
          test "$(go env GOARCH)" = "amd64"
          echo "GITHUB_GO126_HOST=PASS"

      - name: Install matching prebuilt host Node for UI build dependencies
        uses: actions/setup-node@v6
        with:
          node-version: '20.20.2'
          package-manager-cache: false

      - name: Restore ccache from prior GitHub builds
        id: restore_ccache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: r76s-v12-x64-ccache-${{ hashFiles('config/R76S.config') }}-${{ github.sha }}
          restore-keys: |
            r76s-v12-x64-ccache-${{ hashFiles('config/R76S.config') }}-
            r76s-v12-x64-ccache-

      - name: Prepare clean GitHub build workspace and pin iStoreOS source
        run: |
          set -euo pipefail
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /home/builder
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /home/builder/work
          test ! -e /r76s-repo
          sudo ln -s "$GITHUB_WORKSPACE" /r76s-repo
          mkdir -p "$HOME/.ccache" /home/builder/.cache
          ln -s "$HOME/.ccache" /home/builder/.ccache
          ccache -M "$R76S_CCACHE_SIZE" || true
          cd /home/builder/work
          git init -q openwrt
          git -C openwrt remote add origin https://github.com/istoreos/istoreos.git
          git -C openwrt -c http.version=HTTP/1.1 fetch --depth=1 origin fb971407ffd9a094e6f16d9c029f1f580ed5c2ad
          git -C openwrt checkout -q --detach FETCH_HEAD
          test "$(git -C openwrt rev-parse HEAD)" = fb971407ffd9a094e6f16d9c029f1f580ed5c2ad
          echo 'ISTOREOS_PINNED_SOURCE=PASS'

      - name: Build V1.4.2 using all existing 27 guarded stages
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(git rev-parse HEAD)"
          echo "BUILD_SOURCE_SHA=$GITHUB_SHA"
          export V=s
          echo "BUILD_VERBOSE=$V"
          test "${R76S_PUBLIC_RELEASE}" = 1
          test -z "${R76S_CLEAN_FLASH_PASSWORD_HASH}"
          V=s bash build/local-arm64/candidate-inside.sh
          echo 'BUILD_COMPLETE=YES'

      - name: Verify V1.4.2 artifacts and SHA256
        run: |
          set -euo pipefail
          cd /home/builder/work/openwrt/bin/targets/rockchip/armv8/R76S-V1.4.2
          test -s R76S-V1.4.2-TF-squashfs.img.gz
          test -s version.latest
          test -s version.index
          grep -qxF '24.10.8-R76S-V1.4.2' version.index
          grep -qF '[24.10.8-R76S-V1.4.2](R76S-V1.4.2-TF-squashfs.img.gz)' version.latest
          sha256sum -c sha256sums
          echo 'GITHUB_V12_IMAGE_STATIC_AUDIT=PASS'
          test -s ota.json
          sha256sum -c sha256
          echo 'GITHUB_V12_RELEASE_ASSETS=PASS'

      - name: Sign and audit OTA manifest
        env:
          R76S_OTA_SIGNING_KEY: ${{ secrets.R76S_OTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$R76S_OTA_SIGNING_KEY"
          umask 077
          keyfile=$(mktemp)
          trap 'rm -f "$keyfile"' EXIT
          printf '%s\n' "$R76S_OTA_SIGNING_KEY" > "$keyfile"
          unset R76S_OTA_SIGNING_KEY
          release=/home/builder/work/openwrt/bin/targets/rockchip/armv8/R76S-V1.4.2
          openssl pkeyutl -sign -inkey "$keyfile" -rawin -in "$release/ota.json" -out "$release/ota.json.sig"
          cp config/ota-public.pem "$release/ota-public.pem"
          cp docs/R76S-V1.4.2-RELEASE.md "$release/RELEASE-NOTES.md"
          cp files/usr/libexec/r76s/r76s-ota-preserve-state "$release/r76s-ota-preserve-state"
          python3 scripts/r76s-release-audit.py "$release" --finalize

      - name: Trim ccache before saving GitHub cache
        if: always()
        run: |
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M "$R76S_CCACHE_SIZE" || true
          ccache -c || true
          ccache -s || true

      - name: Save compiler cache even after a failed build
        if: always() && steps.restore_ccache.outputs.cache-primary-key != '' && steps.restore_ccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ steps.restore_ccache.outputs.cache-primary-key }}

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: R76S-V1.4.2-cloud-diagnostics-${{ github.run_number }}
          path: |
            /home/builder/work/logs/
            /home/builder/work/r76s-build-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload V1.4.2 firmware
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: R76S-V1.4.2-firmware-${{ github.run_number }}
          path: /home/builder/work/openwrt/bin/targets/rockchip/armv8/R76S-V1.4.2/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Publish R76S-V1.4.2 GitHub Release and OTA assets
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /home/builder/work/openwrt/bin/targets/rockchip/armv8/R76S-V1.4.2
          sha256sum -c sha256
          shopt -s nullglob
          assets=( *.img *.bin *.gz ota.json sha256 sha256sums version.latest version.index ota.footer.html BOOTLOADER_INFO.txt ota.json.sig ota-public.pem RELEASE-NOTES.md TEST-REPORT.txt r76s-ota-preserve-state BUILD-VALIDATION.txt sources.lock.json release.json )
          # Publish the repaired build as the formal Latest release. Historical
          # releases remain untouched; the stable pointer carries metadata only.
          if gh release view R76S-V1.4.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload R76S-V1.4.2 "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit R76S-V1.4.2 --repo "$GITHUB_REPOSITORY" \
              --title R76S-V1.4.2 --notes-file RELEASE-NOTES.md \
              --prerelease=false --draft=false --latest
          else
            gh release create R76S-V1.4.2 "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title R76S-V1.4.2 --notes-file RELEASE-NOTES.md \
              --prerelease=false --latest
          fi
          stable_assets=( ota.json ota.json.sig ota-public.pem version.latest version.index )
          if gh release view R76S-stable --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload R76S-stable "${stable_assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit R76S-stable --repo "$GITHUB_REPOSITORY" \
              --title 'R76S Stable OTA Pointer' --prerelease=false --draft=false --latest=false
          else
            gh release create R76S-stable "${stable_assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title 'R76S Stable OTA Pointer' \
              --notes 'Stable OTA metadata pointer for the formal R76S-V1.4.2 release.' \
              --prerelease=false --latest=false
          fi
          openssl pkeyutl -verify -pubin -inkey ota-public.pem -rawin \
            -in ota.json -sigfile ota.json.sig
